dde3e7;--soft:#e8eef1;--radius:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:40px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--brand)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header.top{background:var(--brand);color:#fff;padding:14px 0 16px;margin-bottom:12px}
header.top .row{display:flex;align-items:center;gap:10px}
header.top h1{font-size:22px;margin:0;line-height:1.2;flex:1;font-weight:700;letter-spacing:.1px}
header.top .sub{opacity:.9;font-size:14px;margin-top:4px}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;min-width:46px;height:46px;font-size:20px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin:10px 0;border:1px solid var(--line)}
.card h2{margin:0 0 8px;font-size:18px;font-weight:700}
.card h3{margin:0;font-size:18px;line-height:1.25}
.muted{color:var(--muted);font-size:15px}
.small{font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:17px;padding:10px 16px;margin:8px 0;text-decoration:none}
.btn:active{opacity:.85}
.btn.alt{background:var(--brand2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.weekpick{display:flex;align-items:center;gap:10px}
.weekpick .lbl{flex:1;text-align:center}
.weekpick .lbl b{display:block;font-size:26px;line-height:1.15}
.weekpick button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:24px;font-weight:700;color:var(--ink)}
.weekpick button:disabled{opacity:.3}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);color:var(--ink);margin:2px 4px 2px 0}
.badge.deload{background:#e0ecf5;color:#24506b}.badge.retest{background:#f6e7d3;color:#7a4515}.badge.base{background:#e1efe4;color:#2d5e3b}
.sess{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;min-height:72px;text-decoration:none;color:inherit}
.sess .tag{flex:none;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:var(--brand)}
.sess .tag.cardio{background:#b07a3c}
.sess .t{flex:1}.sess .t b{font-size:17px;display:block}
.sess .st{font-size:13px;font-weight:700;color:var(--muted)}
.sess.done{border-color:var(--ok);background:#f3faf5}.sess.done .st{color:var(--ok)}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--brand2);border-radius:999px;transition:width .4s}
.check{display:flex;align-items:flex-start;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:26px;height:26px;flex:none;accent-color:var(--ok);margin:0}
.ex.isdone{border-color:var(--ok);background:#f7fcf8}
.ex.test{border-left:4px solid var(--hard)}
.ex .head{display:flex;gap:10px;align-items:flex-start}
.ex .head .num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.ex .target{font-weight:700;font-size:16px;margin-top:2px}
.ex .load{font-size:14px;color:#24506b}
.howto{margin-top:8px}
.howto summary{list-style:none;font-weight:600;font-size:15px;padding:9px 12px;background:var(--soft);border-radius:10px;display:flex;align-items:center}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"\203A";margin-right:8px;transition:transform .2s;display:inline-block;font-size:20px;line-height:1}
.howto[open] summary::before{transform:rotate(90deg)}
.howto .body{padding:8px 4px 2px;font-size:15px}
.sets{display:grid;gap:8px;margin-top:10px}
.set{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:center}
.set.one{grid-template-columns:52px 1fr}
.set>label{font-size:12px;font-weight:700;color:var(--muted)}
.set input,.cardio input,.cardio select,input.txt,textarea{width:100%;min-height:46px;border:1px solid #c9d2d8;border-radius:10px;padding:8px 10px;background:#fff;font-size:17px}
.set input:focus,.cardio input:focus,input.txt:focus,textarea:focus,.cardio select:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.cardio{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cardio label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
.cardio .wide{grid-column:1/3}
textarea{min-height:84px;resize:vertical}
.donebox{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:600;font-size:15px}
.donebox input{width:24px;height:24px;accent-color:var(--ok);margin:0}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:700}
.feel button.on[data-v=EASY]{background:#e1efe4;border-color:var(--ok)}
.feel button.on[data-v=OK]{background:#f8eed6;border-color:var(--warn)}
.feel button.on[data-v=HARD]{background:#f6e0dc;border-color:var(--hard)}
pre.summary{white-space:pre-wrap;word-break:break-word;background:#1f2a33;color:#e6ecef;padding:12px;border-radius:10px;font-size:13px;line-height:1.4;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a33;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;font-size:15px}
.toast.show{opacity:1}
.rules details{background:#fff;border-radius:12px;margin:8px 0;border:1px solid var(--line)}
.rules summary{font-weight:700;font-size:17px;padding:14px;cursor:pointer}
.rules .item{padding:0 14px 10px;font-size:15px}
.rules .item b{display:block}
.rules details.safety{border:2px solid var(--hard)}
.saved{font-size:13px;color:var(--ok);font-weight:700;text-align:center;min-height:18px}
.sessnote{background:#f6efe3;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:6px}
.row{display:flex;gap:10px;align-items:center}
.set.hdr{margin-bottom:-4px}.set.hdr label{font-size:12px;padding-left:4px}
</style></head><body><div id='app'></div><div id='toast' class='toast' role='status'></div><script>window.PERSON='maureen';window.SINGLE_FILE=true;window.PLANS={"maureen":{"id":"maureen","name":"Maureen","coachEmail":"justin.dodd@mail.grokbot.com","coachName":"Coach","title":"12-Week Return-to-Fitness Plan - Maureen","intro":"4 days per week (Day 1-4, any days you like): 3 full-body strength days + 1 cardio day, about 35-45 minutes. Strength days end with 10-15 min of easy bike or incline walking. Everything starts conservatively and adjusts week by week from your results.","targetHeader":"Target load / settings - suggested, adjust","warmup":[{"label":"1. Get warm (3 min)","text":"Easy bike or treadmill walk, gradually picking up the pace."},{"label":"2. Mobility (2 min)","text":"10 cat-cows, 10 bodyweight squats to the bench, 10 hip hinges (hands on hips, push hips back), 10 arm circles each way, 10 glute bridges."},{"label":"3. Ramp-up set (1 min)","text":"Before the first exercise: 1 light set of 6-8 reps (empty handle or no weight) focusing on form."}],"cooldown":[{"label":"Cool-down (3-5 min)","text":"Easy walk, then gentle stretches held 20-30 sec, no bouncing: hip flexors (half-kneeling), hamstrings, glutes (figure-4), calves, chest in a doorway, child's pose."}],"sections":[{"title":"ABOUT THIS PLAN","items":[{"label":"Starting point","text":"Getting back into working out. Goals: toning and more energy. Current fitness is unknown, so the plan deliberately starts light and simple, and the targets adjust from your weekly results."},{"label":"Goal","text":"TONING: full-body strength (legs, glutes, back, arms, core) with good form and progressive load - small weight increases over time, mostly 10-15 reps per set. ENERGY: easy zone 2 cardio (bike, walking, incline walking) that leaves you feeling good, not wiped out."},{"label":"Targets adjust weekly","text":"Every target is a SUGGESTION. Week 1 is a BASELINE week: the weights, reps and cardio numbers you log become your starting point, and future targets are adjusted from what you send back each week (EASY / OK / HARD and your notes)."},{"label":"Phases","text":"Weeks 1-4: FOUNDATION (learn the movements, light loads, 2-3 sets; lighter deload week 4)\nWeeks 5-8: BUILD (3 sets, small load increases, longer cardio with incline; lighter deload week 8)\nWeeks 9-12: STRENGTHEN (slightly heavier sets of 8-10, gentle bike intervals; week 12 = RETEST week: 'see how far you've come' - rep and cardio benchmarks vs. week 1, NO one-rep max)."}]},{"title":"SCHEDULE","items":[{"label":"Days","text":"4 sessions per week, no fixed weekdays - do them in order: Day 1 Strength A, Day 2 Cardio, Day 3 Strength B, Day 4 Strength C. Each session takes about 35-45 minutes."},{"label":"Rest days","text":"Leave at least one rest day between strength days when possible (the cardio day can sit in between). Example: Mon Strength A, Tue Cardio, Thu Strength B, Sat Strength C. Missed a day? Just pick up where you left off - don't double up."},{"label":"Strength A (Day 1)","text":"Goblet squat | Incline push-up (bar in rack) | Lat pulldown | Glute bridge | Dead bug | 10-15 min easy cardio finisher."},{"label":"Cardio (Day 2)","text":"Zone 2 (conversational) bike or treadmill walk: 20-25 min to start, building to 35-40 min, adding incline walking from week 5 and gentle bike intervals in weeks 7 and 10."},{"label":"Strength B (Day 3)","text":"Romanian deadlift | Low cable row | Dumbbell overhead press (seated) | Split squat | Pallof press | 10-15 min easy cardio finisher."},{"label":"Strength C (Day 4)","text":"Hip thrust | Goblet squat with 2-sec pause | Landmine press | One-arm low cable row | Plank | 10-15 min easy cardio finisher."},{"label":"Session length (35-45 min)","text":"5-min warm-up + 20-25 min of strength (rest 60-90 sec between sets) + 10-15 min easy cardio finisher + a short cool-down. To save time, pair a lower-body and an upper-body exercise and alternate them."}]},{"title":"WARM-UP & COOL-DOWN","items":[{"label":"1. Get warm (3 min)","text":"Easy bike or treadmill walk, gradually picking up the pace."},{"label":"2. Mobility (2 min)","text":"10 cat-cows, 10 bodyweight squats to the bench, 10 hip hinges (hands on hips, push hips back), 10 arm circles each way, 10 glute bridges."},{"label":"3. Ramp-up set (1 min)","text":"Before the first exercise: 1 light set of 6-8 reps (empty handle or no weight) focusing on form."},{"label":"Cool-down (3-5 min)","text":"Easy walk, then gentle stretches held 20-30 sec, no bouncing: hip flexors (half-kneeling), hamstrings, glutes (figure-4), calves, chest in a doorway, child's pose."}]},{"title":"HOW HARD SHOULD IT FEEL?","items":[{"label":"Strength: RPE 6-7","text":"Finish each set feeling like you could do 2-3 more good reps. Never train to failure. Slow, controlled reps: about 2-3 seconds down, controlled up, breathe out on the effort (don't hold your breath)."},{"label":"EASY / OK / HARD","text":"EASY = could have done 4+ more reps, form solid. OK = 2-3 reps left (the target). HARD = only 0-1 reps left or form got shaky. Circle one for each session - it drives next week's targets."},{"label":"Cardio: Zone 2","text":"Talk test: you can speak in full sentences (about 3-5 out of 10 effort). 'Moderate' on interval days = short phrases only (about 6/10). Never all-out."},{"label":"Effort scale (1-10)","text":"1-2 very easy, 3-4 easy/conversational, 5-6 moderate, 7-8 hard, 9-10 all-out (never in this plan)."}]},{"title":"PROGRESSION RULES (small steps)","items":[{"label":"How it works","text":"Each exercise has a rep target (e.g., 3 x 10-12). Keep the same weight until ALL sets feel EASY at the top of the range with good form, then add a small amount (2.5-5 lb) next time. If a set is HARD or form slips, stay at that weight (or go lighter)."},{"label":"Load shorthand","text":"H = one EMPTY plate-loading dumbbell handle. WEIGH ONE before week 1 (bathroom scale): ______ lb (often 3-6 lb). 'H+10' = handle with a 5 lb plate on each end. 'H+15*' = add a 2.5 lb plate on each end. '2 handles, each H+10' = one in each hand."},{"label":"Small jumps need 2.5s","text":"Targets marked * need the 2.5 lb plates (recommended purchase). Without them, stay at the previous weight and add 1-2 reps per set instead - the 5 lb plates make 10 lb jumps on a handle, which is too big a step."},{"label":"Machines","text":"Lat pulldown and low cable row: the empty carriage has its own resistance. In week 1, start with nothing loaded and add 5 lb at a time until 12 reps feel about 6-7/10 - write that weight down; it's your start weight."},{"label":"Bodyweight moves","text":"Incline push-ups get harder by lowering the bar one hole at a time (when all sets reach 12 EASY reps). Planks and dead bugs progress with time/reps; split squats move from bodyweight to two handles."},{"label":"Cardio","text":"Add a few minutes each week (20 -> 40 min), then a little treadmill incline (weeks 5-6, 9) and gentle 1-min bike intervals (weeks 7 and 10). Stay conversational except during the short moderate intervals."},{"label":"Deload weeks 4 and 8","text":"Lighter on purpose: 2 sets instead of 3 and/or lighter weights, shorter cardio. Lets your body catch up so you come back stronger. Don't skip them and don't make them harder."},{"label":"Week 12 - retest","text":"Light strength sessions plus the same tests as week 1: max clean incline push-ups at the same bar height, longest good-form plank, and the 20-minute cardio test on the same machine and settings. Also compare your week-2 and week-11 weights on the Progress Log. NO one-rep max tests."},{"label":"Targets","text":"Targets in the plan are SUGGESTIONS ONLY. Your weekly results (weights, reps, EASY/OK/HARD and notes) decide the next week's targets."}]},{"title":"SAFETY","items":[{"label":"Health check","text":"If anything changes (new pain, illness, injury, pregnancy, new medication), check with a doctor before continuing."},{"label":"Stop for pain","text":"Stop the exercise for sharp pain or any joint pain (knees, back, hips, shoulders, wrists). Normal muscle burn and mild soreness 1-2 days later are OK; pain is not. Skip that move and tell Coach."},{"label":"Warning signs","text":"Stop immediately and seek medical help for chest pain or pressure, dizziness or light-headedness, unusual shortness of breath, irregular heartbeat, or feeling faint."},{"label":"Form first","text":"If form breaks down, end the set. Leave 2-3 reps in the tank. Slow and controlled - no bouncing, jerking or swinging."},{"label":"No max testing","text":"No one-rep max (1RM) tests. Progress is measured with reps, holds, weights used for sets, and cardio time/distance."},{"label":"Rack safeties set","text":"Keep the power rack safeties set (pins locked) for incline push-ups and whenever the bar is in the rack. Take the RDL bar from the rack hooks, not the floor."},{"label":"Recovery","text":"Sleep 7-9 hours, drink water before/during/after, eat protein at each meal. Mild soreness is normal early on - an easy walk helps."},{"label":"Environment","text":"Clear floor space, stable shoes, collars on the bar, no loose plates on the floor, treadmill safety clip attached."}]},{"title":"EQUIPMENT NOTES","items":[{"label":"Mikolo F4 power rack + safeties","text":"Incline push-up station: bar on the J-hooks/safeties at hip height to start, lowered one hole at a time. Hold the upright for balance on split squats. Safeties always set."},{"label":"Plate-loaded lat pulldown & low cable row","text":"Lat pulldown, low cable row, one-arm row and the Pallof press (side-on to the low-row cable). Start with nothing loaded and write the carriage weight: ___ lb."},{"label":"Landmine","text":"Landmine press with the 45 lb Olympic bar (you only lift part of the bar's weight). Start with both hands; one arm from week 5."},{"label":"Flat bench + leg extension attachment","text":"Bench = hip thrust support, seated overhead press, squat depth target. Leg extension is not in the plan (optional later)."},{"label":"35 lb bar","text":"Romanian deadlift from week 5 and hip thrust (padded with a towel) from week 9."},{"label":"45 lb Olympic bar","text":"Landmine only."},{"label":"EZ curl bar, pull-up bar, dip handles","text":"Not used in this plan (optional extras later: EZ-bar curls, dead hangs)."},{"label":"Plate-loading dumbbell handles","text":"Weigh one empty handle: ______ lb. Used for goblet squats, RDLs (weeks 1-4), split squats and overhead press."},{"label":"Plates on hand","text":"2 x 45 lb, 4 x 10 lb, 4 x 5 lb. That allows H+10 (5s), H+20 (10s), H+30 (10s + 5s) and 2 handles at H+10 each. Smaller steps need 2.5 lb plates."},{"label":"Fixed dumbbells 25s and 45s","text":"25 lb: goblet squat (weeks 10-12) and hip thrust (weeks 5-7). 45 lb: optional hip thrust in week 11 only if EASY."},{"label":"Indoor bike + treadmill","text":"Cardio day and the 10-15 min finisher after strength days. Note the machine, speed/incline or resistance each time so progress is comparable."},{"label":"No TRX","text":"Not needed; the cable stations and rack cover pulling and the Pallof press."}]},{"title":"SUGGESTED PURCHASES","items":[{"label":"Pair of 2.5 lb plates (2 pairs ideal)","text":"Recommended. Allows +5 lb steps on a handle (2.5 each end) and on the bar, and +2.5 lb on the cable stations. Very low cost; makes the * targets possible."},{"label":"Hip thrust pad or folded towel","text":"For comfort when the 35 lb bar sits on the hips (weeks 9-12)."},{"label":"Nice to have: 1.25 lb plates","text":"Even smaller steps for the overhead press."}]}],"guide":[{"name":"Cat-cow (warm-up)","day":"Warm-up","how":"On hands and knees. Slowly round the back up toward the ceiling (cat), then let the belly drop and lift the chest (cow). Move with your breath, 10 slow reps."},{"name":"Hip hinge drill (warm-up)","day":"Warm-up","how":"Hands on hips, soft knees. Push the hips straight back until you feel the back of the legs stretch, keep a flat back, then stand tall by squeezing the glutes. This is the RDL pattern."},{"name":"Goblet squat","day":"A + C","how":"Hold one dumbbell handle vertically against the chest with both hands. Feet about shoulder width, toes slightly out. Sit down between the heels as deep as you comfortably can with the chest up and heels down (touch the bench first if helpful), then stand tall. Day C version: pause 2 sec at the bottom."},{"name":"Incline push-up (bar in rack)","day":"Strength A","how":"Set the bar on the J-hooks or safeties at hip height (pins locked). Hands a bit wider than shoulders, walk the feet back until the body is a straight line. Lower the chest to the bar, push away. Lower the bar one hole when 12 reps feel EASY on all sets. Higher bar = easier."},{"name":"Lat pulldown","day":"Strength A","how":"Grip a little wider than shoulders, thighs under the pad if there is one. Sit tall, pull the bar to the upper chest by driving the elbows down and back, without leaning way back or yanking. Let it rise slowly."},{"name":"Glute bridge","day":"Strength A","how":"Lie on your back, knees bent, feet flat and hip-width. Ribs down, push through the heels and squeeze the glutes until knees, hips and shoulders line up; pause and lower. Single-leg: one foot lifted, same thing."},{"name":"Dead bug","day":"Strength A","how":"Lie on your back, arms reaching to the ceiling, knees bent at 90 degrees over the hips. Press the low back gently into the floor. Slowly reach the opposite arm and leg out while breathing out, return, switch."},{"name":"Romanian deadlift (RDL)","day":"Strength B","how":"Start STANDING with the weight (bar from the rack hooks at mid-thigh, or a handle in each hand). Soft knees, push the hips back, let the weight slide down the thighs to just below the knees with a flat back and neck in line, then stand by squeezing the glutes. Feel it in the hamstrings, not the low back."},{"name":"Low cable row","day":"Strength B","how":"Sit tall with a slight knee bend, chest up. Pull the handle to the belly while squeezing the shoulder blades together, then let the arms straighten slowly without rounding forward."},{"name":"Dumbbell overhead press (seated)","day":"Strength B","how":"Sit tall on the bench, feet flat, ribs down. Handles at shoulder height, palms facing forward or in. Press straight up until the arms are by the ears, lower slowly. No arching the low back."},{"name":"Split squat","day":"Strength B","how":"Long stance, feet hip-width apart (like train tracks, not a tightrope). Lower the back knee gently toward the floor, front knee over the middle of the foot, torso tall, push through the front heel to rise. Hold the rack for balance. Do all reps, then switch legs."},{"name":"Pallof press (low row cable)","day":"Strength B","how":"Kneel tall or stand side-on to the low-row cable with the handle at the middle of the chest. Brace and press the handle straight out, hold 2 sec without letting the cable twist you, bring it back. All reps one side, then turn around. Substitute: side plank on the knees, 2 x 15-20 sec/side."},{"name":"Hip thrust (shoulders on bench)","day":"Strength C","how":"Sit on the floor with the upper back against the long side of the bench, knees bent, feet flat. Weight (dumbbell or padded bar) across the hip crease. Chin tucked, drive through the heels to lift the hips until level with knees and shoulders, squeeze 1 sec, lower under control."},{"name":"Landmine press","day":"Strength C","how":"45 lb bar in the landmine. Hold the bar end at the chest (both hands to start; later one hand, half-kneeling or standing). Press up and forward until the arm is straight, lower slowly. Ribs down, glutes tight, no leaning back."},{"name":"One-arm low cable row","day":"Strength C","how":"Single handle on the low-row cable. Seated or half-kneeling, pull to the hip, squeeze the shoulder blade back, slow return. All reps, then switch arms."},{"name":"Plank","day":"Strength C","how":"Forearms on the floor under the shoulders, body straight from head to heels, glutes and belly tight, keep breathing. Knees down to make it easier. End the set when the hips sag or the low back arches."},{"name":"Zone 2 cardio (bike or treadmill walk)","day":"Cardio","how":"Easy, steady effort where you can speak in full sentences (about 3-5/10). Warm up 3-5 min, cool down 3-5 min. Log minutes, machine, speed/incline or resistance, and effort 1-10 so progress is comparable week to week."},{"name":"Incline walk","day":"Cardio","how":"Treadmill walk at an easy pace with 2-8% incline. Stand tall; hold the rails only for balance, not to lean on. Lower the incline if calves or shins complain."},{"name":"Gentle bike intervals","day":"Cardio","how":"After an easy warm-up, alternate 1 min moderate (about 6/10, short phrases only) with 2 min easy. Never all-out. Finish with easy pedaling."},{"name":"Cardio finisher","day":"A + B + C","how":"After strength days: 10-15 min of easy bike or incline treadmill walking (zone 2). Log minutes, machine, setting and effort."},{"name":"Benchmark tests (week 1 and week 12)","day":"Tests","how":"Max clean incline push-ups at the same bar hole, longest good-form plank, and a 20-min zone 2 cardio test on the same machine and settings (record distance and effort). Stop every test 1-2 reps before form breaks. No one-rep maxes."}],"weeks":[{"week":1,"phase":"Foundation - BASELINE WEEK","sessions":[{"num":1,"day":"Day 1","type":"Strength A","exercises":[{"name":"Goblet squat","sets":2,"reps":"10-12","target":"H (empty handle)","cue":"BASELINE: learn the move, find comfortable weights. Hold one handle vertically at the chest. Feet shoulder width, sit down between the heels to a comfortable depth (touch the bench at first if needed), chest up, stand tall. All sets EASY at the top of the range -> add 2.5-5 lb next time. HARD or form slips -> stay or go lighter. (* = needs 2.5 lb plates; otherwise stay at the last weight and add 1-2 reps.)","guide":2,"kind":"strength","load":"lb","test":false},{"name":"Incline push-up (bar in rack)","sets":1,"reps":"8-10","target":"Bar in rack at hip height - write hole #","cue":"Bar set in the rack at hip height, safeties set. Body in one straight line, lower chest to the bar, push away. Higher bar = easier.","guide":3,"kind":"strength","load":"hole","test":false},{"name":"BASELINE TEST: Incline push-ups - max clean reps","sets":1,"reps":"Max good-form reps","target":"Same bar height - write hole #","cue":"One set: stop 1-2 reps before form breaks (hips sag or you can't touch the bar). Write reps AND bar hole #. Compared in week 12.","guide":3,"kind":"strength","load":"hole","test":true},{"name":"Lat pulldown","sets":2,"reps":"10-12","target":"Find start (empty, add 5s) - write lb","cue":"BASELINE: learn the move, find comfortable weights. Grip a little wider than shoulders, sit tall, pull the bar to the upper chest by driving elbows down, no leaning back or yanking, 2-sec return. All sets EASY at the top of the range -> add 2.5-5 lb next time. HARD or form slips -> stay or go lighter.","guide":4,"kind":"strength","load":"lb","test":false},{"name":"Glute bridge","sets":2,"reps":"15","target":"Bodyweight","cue":"Lie on your back, knees bent, feet flat. Ribs down, push through the heels, squeeze the glutes until knees-hips-shoulders line up, lower slowly.","guide":5,"kind":"strength","load":"lb","test":false},{"name":"Dead bug (core)","sets":2,"reps":"6/side","target":"Bodyweight","cue":"Low back stays gently pressed to the floor. Slowly reach opposite arm and leg out while breathing out, return, switch. Slow beats fast.","guide":6,"kind":"strength","load":"none","test":false},{"name":"Cardio finisher: easy bike or incline walk","sets":1,"reps":"10 min","target":"Zone 2 - easy, can talk in full sentences","cue":"Bike (light resistance) or treadmill walk at 2-6% incline. Log minutes, machine, setting and effort (1-10). Should feel easy - about 3-4/10.","guide":19,"kind":"cardio","load":"none","test":false}],"dayIndex":1},{"num":2,"day":"Day 2","type":"Cardio","exercises":[{"name":"BASELINE TEST: 20-min zone 2 cardio","sets":1,"reps":"20 min","target":"Bike OR treadmill walk - note machine, setting, distance","cue":"Pick ONE machine for your test. Easy steady pace you could hold a conversation at. Write machine, speed/incline or resistance, DISTANCE and effort (1-10). Repeated exactly in week 12.","guide":16,"kind":"cardio","load":"none","test":true}],"dayIndex":2},{"num":3,"day":"Day 3","type":"Strength B","exercises":[{"name":"Romanian deadlift (RDL)","sets":2,"reps":"10-12","target":"2 empty handles (1 per hand)","cue":"BASELINE: learn the move, find comfortable weights. Start standing (take the bar from the rack hooks at mid-thigh, never from the floor). Soft knees, push hips BACK, weight slides down the thighs to just below the knees with a flat back, stand by squeezing glutes. All sets EASY at the top of the range -> add 2.5-5 lb next time. HARD or form slips -> stay or go lighter.","guide":7,"kind":"strength","load":"lb","test":false},{"name":"Low cable row","sets":2,"reps":"10-12","target":"Find start (empty, add 5s) - write lb","cue":"BASELINE: learn the move, find comfortable weights. Sit tall, slight knee bend. Pull the handle to the belly, squeeze shoulder blades together, 2-sec return without rounding forward. All sets EASY at the top of the range -> add 2.5-5 lb next time. HARD or form slips -> stay or go lighter.","guide":8,"kind":"strength","load":"lb","test":false},{"name":"Dumbbell overhead press (seated)","sets":2,"reps":"10-12","target":"2 empty handles","cue":"BASELINE: learn the move, find comfortable weights. Sit tall on the bench, ribs down, glutes squeezed. Handles at the shoulders, press up until arms are by the ears, lower slowly. No arching the low back. (* = needs 2.5 lb plates.)","guide":9,"kind":"strength","load":"lb","test":false},{"name":"Split squat","sets":2,"reps":"8/leg","target":"Bodyweight, hold the rack","cue":"Long stance, feet hip width (like train tracks). Lower the back knee gently toward the floor, front knee over the middle of the foot, push through the front heel. Hold the rack for balance as needed.","guide":10,"kind":"strength","load":"lb","test":false},{"name":"Pallof press (low row cable)","sets":2,"reps":"8/side","target":"Tall-kneeling, nothing loaded","cue":"Stand or kneel side-on to the low-row cable, handle at the chest. Press straight out, hold 2 sec without letting the cable twist you, bring back. Do all reps, then face the other way. If the cable can't be pulled sideways safely, do a side plank on the knees instead.","guide":11,"kind":"strength","load":"lb","test":false},{"name":"Cardio finisher: easy bike or incline walk","sets":1,"reps":"10 min","target":"Zone 2 - easy, can talk in full sentences","cue":"Bike (light resistance) or treadmill walk at 2-6% incline. Log minutes, machine, setting and effort (1-10). Should feel easy - about 3-4/10.","guide":19,"kind":"cardio","load":"none","test":false}],"dayIndex":3},{"num":4,"day":"Day 4","type":"Strength C","exercises":[{"name":"Hip thrust (shoulders on bench)","sets":2,"reps":"12","target":"Bodyweight","cue":"BASELINE: learn the move, find comfortable weights. Upper back on the long side of the bench, feet flat, chin tucked. Drive through the heels until hips are level with knees and shoulders, squeeze 1 sec, lower. Pad the bar with a folded towel.","guide":12,"kind":"strength","load":"lb","test":false},{"name":"Goblet squat - 2-sec pause","sets":2,"reps":"10","target":"Bodyweight, sit to the bench","cue":"Lighter second squat day: same goblet squat, pause 2 seconds at the bottom staying tight, then stand. (* = needs 2.5 lb plates.)","guide":2,"kind":"strength","load":"lb","test":false},{"name":"Landmine press","sets":2,"reps":"10-12","target":"Bar only, both hands, standing","cue":"BASELINE: learn the move, find comfortable weights. 45 lb bar in the landmine (you only lift part of it). Hold the end at the chest, press up and forward until the arm is long, lower t week.","guide":3,"kind":"strength","load":"hole","test":false},{"name":"Lat pulldown","sets":3,"reps":"12","target":"Week-1 weight","cue":"Grip a little wider than shoulders, sit tall, pull the bar to the upper chest by driving elbows down, no leaning back or yanking, 2-sec return. All sets EASY at the top of the range -> add 2.5-5 lb next time. HARD or form slips -> stay or go lighter.","guide":4,"kind":"strength","load":"lb","test":false},{"name":"Glute bridge","sets":2,"reps":"15","target":"Bodyweight","cue":"Lie on your back, knees bent, feet flat. Ribs down, push through the heels, squeeze the glutes until knees-hips-shoulders line up, lower slowly.","guide":5,"kind":"strength","load":"lb","test":false},{"name":"Dead bug (core)","sets":2,"reps":"6/side","target":"Bodyweight","cue":"Low back stays gently pressed to the floor. Slowly reach opposite arm and leg out while breathing out, return, switch. Slow beats fast.","guide":6,"kind":"strength","load":"none","test":false},{"name":"Cardio finisher: easy bike or incline walk","sets":1,"reps":"10 min","target":"Zone 2 - easy, can talk in full sentences","cue":"Bike (light resistance) or treadmill walk at 2-6% incline. Log minutes, machine, setting and effort (1-10). Should feel easy - about 3-4/10.","guide":19,"kind":"cardio","load":"none","test":false}],"dayIndex":1},{"num":6,"day":"Day 2","type":"Cardio","exercises":[{"name":"Zone 2 cardio","sets":1,"reps":"22 min","target":"Bike or treadmill walk, easy pace","cue":"Talk test: you can speak in full sentences. Effort about 4/10. Same pace or a touch faster than week 1.","guide":16,"kind":"cardio","load":"none","test":false}],"dayIndex":2},{"num":7,"day":"Day 3","type":"Strength B","exercises":[{"name":"Romanian deadlift (RDL)","sets":3,"reps":"12","target":"2 handles, each H+10","cue":"Start standing (take the bar from the rack hooks at mid-thigh, never from the floor). Soft knees, push hips BACK, weight slides down the thighs to just below the knees with a flat  with knees and shoulders, squeeze 1 sec, lower. Pad the bar with a folded towel.","guide":12,"kind":"strength","load":"lb","test":false},{"name":"Goblet squat - 2-sec pause","sets":2,"reps":"10","target":"H+10","cue":"Lighter second squat day: same goblet squat, pause 2 seconds at the bottom staying tight, then stand. (* = needs 2.5 lb plates.)","guide":2,"kind":"strength","load":"lb","test":false},{"name":"Landmine press","sets":2,"reps":"8/arm","target":"Bar only, one arm","cue":"RETEST WEEK: light sets, then the retest. 45 lb bar in the landmine (you only lift part of it). Hold the end at the chest, press up and forward until the arm is long, lower slowly. Ribs down, no leaning back.","guide":13,"kind":"strength","load":"lb","test":false},{"name":"One-arm low cable row","sets":2,"reps":"10/arm","target":"Light","cue":"Seated or half-kneeling at the low-row station with a single handle. Pull to the hip, squeeze the shoulder blade back, slow return. Do all reps, then switch arms.","guide":14,"kind":"strength","load":"lb","test":false},{"name":"RETEST: Plank - longest good-form hold","sets":1,"reps":"Max good-form sec","target":"Same version as week 1","cue":"Same rules as week 1. Compare with your week-1 time!","guide":15,"kind":"strength","load":"none","test":true},{"name":"Cardio finisher: easy bike or incline walk","sets":1,"reps":"10 min","target":"Zone 2 - easy, can talk in full sentences","cue":"Bike (light resistance) or treadmill walk at 2-6% incline. Log minutes, machine, setting and effort (1-10). Should feel easy - about 3-4/10.","guide":19,"kind":"cardio","load":"none","test":false}],"dayIndex":4}],"deload":false,"retest":true,"baseline":false}]}};</script><script>/* Adult Fitness Tracker - vanilla JS, no network, data saved in localStorage on this phone. Strength + cardio logging. */
(function () {
  "use strict";
  var PID = window.PERSON || "maureen";
  var P = (window.PLANS || {})[PID];
  var app = document.getElementById("app");
  if (!P) { app.innerHTML = "<p style='padding:20px'>Plan data missing.<\/p>"; return; }
  var KEY = "fitTracker:v1:" + PID, NW = P.weeks.length, ND = P.weeks[0].sessions.length, TOTAL = NW * ND;
  var FEEL = ["EASY", "OK", "HARD"], MACHINES = ["Bike", "Treadmill", "Other"];
  var S = load(), viewWeek = null;

  function load() { try { var s = JSON.parse(localStorage.getItem(KEY) || "{}"); if (s && typeof s === "object") { s.sessions = s.sessions || {}; s.weekNotes = s.weekNotes || {}; return s; } } catch (e) {} return { sessions: {}, weekNotes: {} }; }
  var saveTimer;
  function save(quiet) {
    S.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem("kidStrength:lastKid", PID); } catch (e) { toast("Could not save - storage full?"); }
    if (!quiet) { var el = document.getElementById("saved"); if (el) { el.textContent = "Saved"; clearTimeout(saveTimer); saveTimer = setTimeout(function () { el.textContent = ""; }, 1200); } }
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function sk(w, d) { return "w" + w + "d" + d; }
  function rec(w, d, create) { var k = sk(w, d); if (!S.sessions[k] && create) S.sessions[k] = { warm: {}, ex: {}, feel: "", notes: "" }; return S.sessions[k]; }
  function week(w) { return P.weeks[w - 1]; }
  function sess(w, d) { return week(w).sessions[d - 1]; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parseDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmtShort(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }
  function currentWeek() {
    var st = parseDate(S.startDate);
    if (st) { var n = new Date(); n.setHours(0, 0, 0, 0); return Math.min(NW, Math.max(1, Math.floor((n - st) / 864e5 / 7) + 1)); }
    for (var w = 1; w <= NW; w++) for (var d = 1; d <= ND; d++) { var r = rec(w, d); if (!r || !r.finished) return w; }
    return NW;
  }
  function weekDates(w) { var st = parseDate(S.startDate); if (!st) return ""; var a = new Date(st); a.setDate(a.getDate() + (w - 1) * 7); var b = new Date(a); b.setDate(b.getDate() + 6); return fmtShort(a) + " - " + fmtShort(b); }
  function doneCount() { var n = 0; for (var k in S.sessions) if (S.sessions[k] && S.sessions[k].finished) n++; return n; }
  function weekDone(w) { var n = 0; for (var d = 1; d <= ND; d++) { var r = rec(w, d); if (r && r.finished) n++; } return n; }
  function badges(wk) {
    var h = "<span class='badge'>" + esc(wk.phase.split(" - ")[0]) + "<\/span>";
    if (wk.deload) h += "<span class='badge deload'>Deload - lighter week<\/span>";
    if (wk.retest) h += "<span class='badge retest'>Retest week<\/span>";
    if (wk.baseline) h += "<span class='badge base'>Baseline week<\/span>";
    return h;
  }
  function tag(s) { return s.type === "Cardio" ? "<span class='tag cardio' aria-hidden='true'>&#x1F6B4;<\/span>" : "<span class='tag'>" + esc(s.type.slice(-1)) + "<\/span>"; }
  function sessSummary(s) {
    var st = s.exercises.filter(function (e) { return e.kind !== "cardio"; }), cd = s.exercises.filter(function (e) { return e.kind === "cardio"; });
    if (!st.length) return cd.map(function (e) { return e.reps + " · " + e.name.replace(/^(BASELINE TEST|RETEST): /, "test: "); }).join(", ");
    return st.length + " exercises" + (cd.length ? " + " + cd[0].reps + " cardio finisher" : "");
  }
  function isTime(reps) { return /sec/i.test(reps); }
  function header(title, sub, back) {
    return "<header class='top'><div class='wrap'><div class='row'>" + (back ? "<a class='iconbtn' href='" + back + "' aria-label='Back'>&#8249;<\/a>" : "") +
      "<h1>" + title + "<\/h1>" + (back ? "" : "<a class='iconbtn' href='#/rules' aria-label='Plan guide and safety'>?<\/a>") + "<\/div>" +
      (sub ? "<div class='sub'>" + sub + "<\/div>" : "") + "<\/div><\/header>";
  }

  /* ---------------- HOME ---------------- */
  function home(w) {
    w = w || viewWeek || currentWeek(); viewWeek = w;
    var wk = week(w), cw = currentWeek(), done = doneCount();
    var h = header(esc(P.name) + "'s Training", "12-week return-to-fitness plan &middot; " + done + " of " + TOTAL + " sessions done");
    h += "<main class='wrap'><div class='card'><div class='weekpick'><button data-act='wk' data-w='" + (w - 1) + "' " + (w <= 1 ? "disabled" : "") + " aria-label='Previous week'>&#8249;<\/button>" +
      "<div class='lbl'><span class='muted'>WEEK<\/span><b id='weeknum'>" + w + " <span class='muted' style='font-size:16px'>of " + NW + "<\/span><\/b>" +
      (S.startDate ? "<span class='muted small'>" + weekDates(w) + (w === cw ? " &middot; this week" : "") + "<\/span>" : "") + "<\/div>" +
      "<button data-act='wk' data-w='" + (w + 1) + "' " + (w >= NW ? "disabled" : "") + " aria-label='Next week'>&#8250;<\/button><\/div>" +
      "<div style='text-align:center;margin-top:8px'>" + badges(wk) + "<\/div>" +
      (w !== cw ? "<button class='btn ghost' data-act='wk' data-w='" + cw + "'>Go to " + (S.startDate ? "this" : "next") + " week (" + cw + ")<\/button>" : "") + "<\/div>";
    if (wk.deload) h += "<div class='sessnote'>Deload week: lighter on purpose - fewer sets, lighter weights, shorter cardio. Let your body catch up.<\/div>";
    if (wk.retest) h += "<div class='sessnote'>Retest week: light sessions plus the same tests as week 1. See how far you've come - no max lifts.<\/div>";
    wk.sessions.forEach(function (s) {
      var r = rec(w, s.dayIndex), started = r && (r.date || Object.keys(r.ex || {}).length);
      h += "<a class='sess " + (r && r.finished ? "done" : "") + "' href='#/s/" + w + "/" + s.dayIndex + "'>" + tag(s) +
        "<span class='t'><b>" + esc(s.day) + " &middot; " + esc(s.type) + "<\/b><span class='muted small'>" + esc(sessSummary(s)) + "<\/span><\/span>" +
        "<span class='st'>" + (r && r.finished ? "Done" : started ? "Started" : "&#8250;") + "<\/span><\/a>";
    });
    h += "<p class='muted small' style='margin:4px 2px'>Do them in order, any days you like. Leave at least one rest day between strength days when possible.<\/p>";
    h += "<a class='btn alt' href='#/send/" + w + "'>Send week " + w + " to " + esc(P.coachName) + "<\/a>";
    h += "<div class='card'><h2>Progress<\/h2><div class='bar'><i style='width:" + Math.round(done / TOTAL * 100) + "%'><\/i><\/div><div class='muted small'>" + done + " / " + TOTAL + " sessions &middot; this week " + weekDone(w) + " / " + ND + "<\/div><\/div>";
    h += "<div class='card'><h2>Start date<\/h2><div class='muted small'>First day of week 1. The app then opens on the right week automatically.<\/div>" +
      "<input class='txt' type='date' id='startDate' value='" + esc(S.startDate || "") + "' style='margin-top:8px'><\/div>";
    h += "<div class='grid2'><a class='btn ghost' href='#/rules'>Plan &amp; safety<\/a><a class='btn ghost' href='#/backup'>Backup<\/a><\/div>";
    if (!window.SINGLE_FILE) h += "<a class='btn ghost' href='../index.html?pick=1'>Switch person<\/a>";
    h += "<p class='muted small' style='text-align:center'>Stop for pain. Good form first; finish sets with 2-3 reps in the tank.<\/p><\/main>";
    return h;
  }

  /* ---------------- SESSION ---------------- */
  function strengthBoxes(ei, ex, e) {
    var reps = e.r || [], wts = e.w || [], unit = isTime(ex.reps) ? "sec" : "reps", h = "<div class='sets'>";
    var ll = ex.load === "hole" ? "hole #" : "lb";
    h += ex.load === "none" ? "<div class='set one hdr'><span><\/span><label>" + unit + "<\/label><\/div>" : "<div class='set hdr'><span><\/span><label>" + (ex.load === "hole" ? "bar hole #" : "weight (lb)") + "<\/label><label>" + unit + "<\/label><\/div>";
    for (var i = 0; i < ex.sets; i++) {
      var rp = "<input data-f='r' data-e='" + ei + "' data-i='" + i + "' inputmode='numeric' autocomplete='off' placeholder='" + unit + "' value='" + esc(reps[i] || "") + "' aria-label='Set " + (i + 1) + " " + unit + "'>";
      if (ex.load === "none") { h += "<div class='set one'><label>SET " + (i + 1) + "<\/label>" + rp + "<\/div>"; continue; }
      var wt = "<input data-f='w' data-e='" + ei + "' data-i='" + i + "' inputmode='decimal' autocomplete='off' placeholder='" + ll + "' value='" + esc(wts[i] || "") + "' aria-label='Set " + (i + 1) + " " + (ex.load === "hole" ? "bar hole number" : "weight in pounds") + "'>";
      h += "<div class='set'><label>SET " + (i + 1) + "<\/label>" + wt + rp + "<\/div>";
    }
    return h + "<\/div>";
  }
  function cardioBoxes(ei, ex, e) {
    var opt = "<option value=''>Choose…<\/option>" + MACHINES.map(function (m) { return "<option" + (e.mach === m ? " selected" : "") + ">" + m + "<\/option>"; }).join("");
    var eff = "<option value=''>–<\/option>"; for (var k = 1; k <= 10; k++) eff += "<option" + (String(e.eff) === String(k) ? " selected" : "") + ">" + k + "<\/option>";
    return "<div class='cardio'><div><label for='min" + ei + "'>Minutes<\/label><input id='min" + ei + "' data-f='min' data-e='" + ei + "' inputmode='decimal' autocomplete='off' placeholder='min' value='" + esc(e.min || "") + "'><\/div>" +
      "<div><label for='mach" + ei + "'>Machine<\/label><select id='mach" + ei + "' data-f='mach' data-e='" + ei + "'>" + opt + "<\/select><\/div>" +
      "<div class='wide'><label for='set" + ei + "'>Speed / incline or resistance" + (ex.test ? " + distance" : "") + "<\/label><input id='set" + ei + "' data-f='set' data-e='" + ei + "' autocomplete='off' placeholder='e.g. 3.0 mph 4% or level 5' value='" + esc(e.set || "") + "'><\/div>" +
      "<div class='wide'><label for='eff" + ei + "'>Effort (1-10)  ·  zone 2 ≈ 3-5, can talk in sentences<\/label><select id='eff" + ei + "' data-f='eff' data-e='" + ei + "'>" + eff + "<\/select><\/div><\/div>";
  }
  function session(w, d) {
    var s = sess(w, d), wk = week(w), r = rec(w, d) || {};
    var h = header(esc(s.day) + " &middot; " + esc(s.type), "Week " + w + " &middot; Session " + s.num + " of " + TOTAL, "#/week/" + w);
    h += "<main class='wrap'><div>" + badges(wk) + "<\/div>";
    h += "<div class='card'><h2>Warm-up (5 min)<\/h2>" + P.warmup.map(function (it, i) {
      return "<label class='check'><input type='checkbox' data-f='warm' data-i='" + i + "' " + (r.warm && r.warm[i] ? "checked" : "") + "><span><b>" + esc(it.label) + "<\/b><br><span class='small'>" + esc(it.text) + "<\/span><\/span><\/label>";
    }).join("") + "<\/div>";
    s.exercises.forEach(function (ex, ei) {
      var e = (r.ex && r.ex[ei]) || {}, g = ex.guide != null ? P.guide[ex.guide] : null, cardio = ex.kind === "cardio";
      h += "<section class='card ex " + (e.done ? "isdone " : "") + (ex.test ? "test" : "") + "' id='ex" + ei + "'><div class='head'><span class='num'>" + (ei + 1) + "<\/span><div style='flex:1'><h3>" + esc(ex.name) + "<\/h3>" +
        "<div class='target'>" + (cardio ? esc(ex.reps) : ex.sets + " &times; " + esc(ex.reps)) + "<\/div><div class='load'>" + esc(ex.target) + "<\/div><\/div><\/div>" +
        "<details class='howto'><summary>How to / tips<\/summary><div class='body'>" + (g ? "<p style='margin-top:0'>" + esc(g.how) + "<\/p>" : "") + "<p class='muted' style='margin-bottom:0'>" + esc(ex.cue) + "<\/p><\/div><\/details>" +
        (cardio ? cardioBoxes(ei, ex, e) : strengthBoxes(ei, ex, e)) +
        "<input class='txt' data-f='note' data-e='" + ei + "' placeholder='Notes (how it felt, adjustments…)' value='" + esc(e.note || "") + "' style='margin-top:8px'>" +
        "<label class='donebox'><input type='checkbox' data-f='done' data-e='" + ei + "' " + (e.done ? "checked" : "") + "> Done<\/label><\/section>";
    });
    if (P.cooldown.length) h += "<div class='card'><h2>Cool-down<\/h2>" + P.cooldown.map(function (it) { return "<label class='check'><input type='checkbox' data-f='cool' " + (r.cool ? "checked" : "") + "><span><b>" + esc(it.label) + "<\/b><br><span class='small'>" + esc(it.text) + "<\/span><\/span><\/label>"; }).join("") + "<\/div>";
    h += "<div class='card'><h2>How did it feel overall?<\/h2><div class='feel'>" + FEEL.map(function (f) { return "<button data-act='feel' data-v='" + f + "' class='" + (r.feel === f ? "on" : "") + "'>" + f + "<\/button>"; }).join("") + "<\/div>" +
      "<p class='muted small' style='margin:8px 0 0'>EASY = 4+ reps left &middot; OK = 2-3 left (the target) &middot; HARD = 0-1 left or form got shaky<\/p>" +
      "<h2 style='margin-top:14px'>Notes<\/h2><textarea data-f='notes' placeholder='Energy, sleep, anything too easy or too hard, anything that hurt'>" + esc(r.notes || "") + "<\/textarea><\/div>";
    h += "<div class='saved' id='saved'><\/div><button class='btn green' data-act='finish'>" + (r.finished ? "Finished ✓" : "Finish session") + "<\/button>";
    var nx = d < ND ? [w, d + 1] : (w < NW ? [w + 1, 1] : null);
    h += "<div class='grid2'><a class='btn ghost' href='#/week/" + w + "'>Week " + w + "<\/a>" + (nx ? "<a class='btn ghost' href='#/s/" + nx[0] + "/" + nx[1] + "'>Next session &#8250;<\/a>" : "<a class='btn ghost' href='#/send/" + NW + "'>Send<\/a>") + "<\/div><\/main>";
    return h;
  }

  /* ---------------- SUMMARY / SEND ---------------- */
  function fmtStrength(ex, e) {
    var out = [];
    for (var i = 0; i < ex.sets; i++) {
      var rp = ((e.r || [])[i] || "").trim(), wt = ((e.w || [])[i] || "").trim();
      if (!rp && !wt) continue;
      var u = isTime(ex.reps) ? "s" : "";
      if (ex.load === "hole") out.push((wt ? "hole " + wt + " x " : "") + (rp || "?"));
      else if (wt) out.push(wt + (/^[\d.]+$/.test(wt) ? "lb" : "") + " x " + (rp || "?") + u);
      else out.push(rp + u);
    }
    return out.join(", ");
  }
  function fmtCardio(e) {
    var b = [];
    if ((e.min || "").trim()) b.push(e.min.trim() + " min");
    if (e.mach) b.push(e.mach);
    if ((e.set || "").trim()) b.push(e.set.trim());
    if (e.eff) b.push("effort " + e.eff + "/10");
    return b.join(", ");
  }
  function sessionBlock(w, d) {
    var s = sess(w, d), r = rec(w, d), L = [], head = s.day + " " + s.type;
    if (!r || (!r.finished && !r.date && !Object.keys(r.ex || {}).length && !(r.notes || "").trim())) return head + ": not done yet";
    var bits = [head]; if (r.date) bits.push(fmtShort(parseDate(r.date)));
    bits.push(r.finished ? "FINISHED" : "partly done"); if (r.feel) bits.push("felt " + r.feel);
    L.push(bits.join(" | "));
    s.exercises.forEach(function (ex, ei) {
      var e = (r.ex || {})[ei] || {}, cardio = ex.kind === "cardio", got = cardio ? fmtCardio(e) : fmtStrength(ex, e);
      var nm = ex.name.replace(/^Cardio finisher:.*/, "Cardio finisher").replace(/\s*\((bar in rack|seated|core|low row cable|shoulders on bench)\)/, "");
      var line = "- " + nm + " (" + (cardio ? ex.reps : ex.sets + "x" + ex.reps) + "): " + (got || (e.done ? "done" : "-"));
      if ((e.note || "").trim()) line += " [" + e.note.trim() + "]";
      L.push(line);
    });
    if ((r.notes || "").trim()) L.push("  Notes: " + r.notes.trim());
    return L.join("\n");
  }
  function weekHeader(w, part, of) {
    return P.name + " - Week " + w + " of " + NW + " (" + week(w).phase + ")" + (of > 1 ? " - part " + part + "/" + of : "") + "\n" +
      (S.startDate ? "Dates: " + weekDates(w) + "\n" : "") + "Sessions finished: " + weekDone(w) + "/" + ND;
  }
  function weekParts(w) {
    var LIMIT = 1800, blocks = [];
    for (var d = 1; d <= ND; d++) blocks.push(sessionBlock(w, d));
    var wn = (S.weekNotes[w] || "").trim(); if (wn) blocks.push("Week notes: " + wn);
    var foot = "(sent from " + P.name + "'s tracker app)";
    var full = weekHeader(w, 1, 1) + "\n\n" + blocks.join("\n\n") + "\n\n" + foot;
    if (full.length <= LIMIT) return [full];
    var parts = [], cur = [], room = LIMIT - 130;
    blocks.forEach(function (b) {
      while (b.length > room) { if (cur.length) { parts.push(cur); cur = []; } parts.push([b.slice(0, room)]); b = "(cont.) " + b.slice(room); }
      if ((cur.join("\n\n") + "\n\n" + b).length > room && cur.length) { parts.push(cur); cur = []; }
      cur.push(b);
    });
    if (cur.length) parts.push(cur);
    return parts.map(function (p, i) { return weekHeader(w, i + 1, parts.length) + "\n\n" + p.join("\n\n") + (i === parts.length - 1 ? "\n\n" + foot : ""); });
  }
  function subject(w, i, n) { return P.name + " Week " + w + " results" + (n > 1 ? " (part " + (i + 1) + " of " + n + ")" : ""); }
  function mailto(w, body, i, n) { return "mailto:" + P.coachEmail + "?subject=" + encodeURIComponent(subject(w, i, n)) + "&body=" + encodeURIComponent(body); }
  function send(w) {
    var parts = weekParts(w), all = parts.join("\n\n");
    var h = header("Send week " + w + " to " + esc(P.coachName), "Goes to " + esc(P.coachName) + ": " + esc(P.coachEmail), "#/week/" + w);
    h += "<main class='wrap'><div class='card'><div class='weekpick'><a class='iconbtn' style='background:var(--soft);color:var(--ink)' href='#/send/" + Math.max(1, w - 1) + "' aria-label='Previous week'>&#8249;<\/a><div class='lbl'><b>Week " + w + "<\/b><\/div><a class='iconbtn' style='background:var(--soft);color:var(--ink)' href='#/send/" + Math.min(NW, w + 1) + "' aria-label='Next week'>&#8250;<\/a><\/div><\/div>";
    h += "<div class='card'><h2>Notes for the week (optional)<\/h2><textarea data-f='weeknote' data-w='" + w + "' placeholder='Energy, sleep, missed days, what felt too easy or too hard, anything that hurt'>" + esc(S.weekNotes[w] || "") + "<\/textarea><div class='saved' id='saved'><\/div><\/div>";
    parts.forEach(function (p, i) { h += "<a class='btn' id='mail" + i + "' href='" + esc(mailto(w, p, i, parts.length)) + "'>Email " + (parts.length > 1 ? "part " + (i + 1) + " of " + parts.length : "week " + w + " to " + esc(P.coachName)) + "<\/a>"; });
    h += "<button class='btn ghost' data-act='copy'>Copy results<\/button>";
    h += "<p class='muted small'>Opens your mail app with everything filled in - just press Send. If nothing opens, tap <b>Copy results<\/b> and paste into an email to <b>" + esc(P.coachEmail) + "<\/b> with subject <b>" + esc(subject(w, 0, 1)) + "<\/b>." + (parts.length > 1 ? " It's long, so it's split into " + parts.length + " emails." : "") + "<\/p>";
    h += "<div class='card'><h2>Preview<\/h2><div class='muted small'>" + all.length + " characters<\/div><pre class='summary' id='summary'>" + esc(all) + "<\/pre><\/div><\/main>";
    return h;
  }

  /* ---------------- PLAN & SAFETY ---------------- */
  function rules() {
    var h = header("Plan &amp; safety", esc(P.title), "#/week/" + (viewWeek || currentWeek()));
    h += "<main class='wrap rules'><div class='card'><p style='margin:0'>" + esc(P.intro) + "<\/p><\/div>";
    var order = P.sections.slice().sort(function (a, b) { return (/SAFETY/.test(b.title) ? 1 : 0) - (/SAFETY/.test(a.title) ? 1 : 0); });
    order.forEach(function (sec) {
      var safe = /SAFETY/.test(sec.title);
      h += "<details class='" + (safe ? "safety" : "") + "' " + (safe || /SCHEDULE/.test(sec.title) ? "open" : "") + "><summary>" + esc(sec.title) + "<\/summary>";
      sec.items.forEach(function (it) { h += "<div class='item'><b>" + esc(it.label) + "<\/b>" + esc(it.text).replace(/\n/g, "<br>") + "<\/div>"; });
      h += "<\/details>";
    });
    h += "<details><summary>Exercise guide<\/summary>" + P.guide.map(function (g) { return "<div class='item'><b>" + esc(g.name) + " <span class='badge'>" + esc(g.day) + "<\/span><\/b>" + esc(g.how) + "<\/div>"; }).join("") + "<\/details>";
    return h + "<\/main>";
  }

  /* ---------------- BACKUP ---------------- */
  function backup() {
    var h = header("Backup", "Save or move your log", "#/week/" + (viewWeek || currentWeek()));
    h += "<main class='wrap'><div class='card'><h2>Save a backup<\/h2><p class='muted small'>Everything saves on this phone automatically. Download a backup now and then (and before switching phones).<\/p>" +
      "<button class='btn' data-act='export'>Download backup file<\/button><button class='btn ghost' data-act='copybackup'>Copy backup as text<\/button><\/div>" +
      "<div class='card'><h2>Restore<\/h2><p class='muted small'>Pick a backup file, or paste backup text.<\/p><input type='file' id='importFile' accept='application/json,.json,text/plain'>" +
      "<textarea id='importText' placeholder='…or paste backup text here' style='margin-top:10px'><\/textarea><button class='btn ghost' data-act='importtext'>Restore from text<\/button><\/div>" +
      "<div class='card'><button class='btn ghost' data-act='reset' style='color:var(--hard)'>Erase " + esc(P.name) + "'s log on this phone<\/button><\/div><\/main>";
    return h;
  }
  function backupObj() { var people = {}; people[PID] = S; return { app: "fitness-tracker", version: 1, exportedAt: new Date().toISOString(), people: people }; }
  function doImport(text) {
    var o; try { o = JSON.parse(text); } catch (e) { toast("That isn't a backup file"); return; }
    var d = o && o.people && o.people[PID] ? o.people[PID] : (o && o.sessions ? o : null);
    if (!d || typeof d !== "object" || !d.sessions) { toast("No " + P.name + " data in that backup"); return; }
    if (!confirm("Restore this backup?\nIt replaces the current log on this phone.")) return;
    localStorage.setItem(KEY, JSON.stringify(d)); S = load(); toast("Backup restored"); location.hash = "#/home"; render();
  }

  /* ---------------- helpers ---------------- */
  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove("show"); }, 2200); }
  function copyText(text) {
    function fb() { var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); toast(ok ? "Copied - paste it into an email" : "Select the preview text and copy it"); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast("Copied - paste it into an email"); }, fb); else fb();
  }
  function finish(w, d) {
    var r = rec(w, d, true); r.finished = true; r.finishedAt = r.finishedAt || new Date().toISOString(); r.date = r.date || todayStr(); save();
    var btn = document.querySelector("[data-act=finish]"); if (btn) btn.textContent = "Finished ✓";
    toast(d === ND ? "Week " + w + " complete - send it to " + P.coachName + "!" : "Session saved. Nice work!");
  }

  /* ---------------- router & events ---------------- */
  function route() { return (location.hash || "#/home").slice(2).split("/"); }
  function render() {
    var p = route(), w = Math.min(NW, Math.max(1, parseInt(p[1], 10) || 0)) || null, html;
    if (p[0] === "s" && w && +p[2] >= 1 && +p[2] <= ND) { viewWeek = w; html = session(w, +p[2]); document.title = P.name + " · Week " + w + " Day " + p[2]; }
    else if (p[0] === "send") { w = w || viewWeek || currentWeek(); viewWeek = w; html = send(w); document.title = P.name + " · Send week " + w; }
    else if (p[0] === "rules") { html = rules(); document.title = P.name + " · Plan & safety"; }
    else if (p[0] === "backup") { html = backup(); document.title = P.name + " · Backup"; }
    else { html = home(p[0] === "week" ? w : null); document.title = P.name + "'s Training Tracker"; }
    app.innerHTML = html; window.scrollTo(0, 0);
  }
  function ctx() { var p = route(); return p[0] === "s" ? { w: +p[1], d: +p[2] } : null; }
  function onField(ev) {
    var el = ev.target, f = el.getAttribute && el.getAttribute("data-f");
    if (el.id === "startDate") { S.startDate = el.value || null; save(true); viewWeek = null; if (ev.type === "change") render(); return; }
    if (f === "weeknote") { S.weekNotes[el.getAttribute("data-w")] = el.value; save(); refreshSend(); return; }
    if (!f) return;
    var c = ctx(); if (!c) return;
    var r = rec(c.w, c.d, true), ei = el.getAttribute("data-e"), i = +el.getAttribute("data-i");
    if (!r.date) r.date = todayStr();
    var e = ei != null ? (r.ex[ei] = r.ex[ei] || {}) : null;
    if (f === "r" || f === "w") { (e[f] = e[f] || [])[i] = el.value.trim(); if (f === "r") autoDone(c, ei, e, el); }
    else if (f === "min" || f === "mach" || f === "set" || f === "eff") { e[f] = el.value; if (f === "min" && el.value.trim()) markDone(e, el); }
    else if (f === "note") e.note = el.value;
    else if (f === "done") { e.done = el.checked; el.closest(".ex").classList.toggle("isdone", el.checked); }
    else if (f === "warm") r.warm[i] = el.checked;
    else if (f === "cool") r.cool = el.checked;
    else if (f === "notes") r.notes = el.value;
    save();
  }
  function markDone(e, el) { if (e.done) return; e.done = true; var card = el.closest(".ex"); card.classList.add("isdone"); card.querySelector("[data-f=done]").checked = true; }
  function autoDone(c, ei, e, el) {
    var ex = sess(c.w, c.d).exercises[ei];
    for (var k = 0; k < ex.sets; k++) if (!((e.r || [])[k] || "").trim()) return;
    markDone(e, el);
  }
  function refreshSend() {
    var w = viewWeek, parts = weekParts(w), pre = document.getElementById("summary");
    if (pre) pre.textContent = parts.join("\n\n");
    var a0 = document.getElementById("mail0");
    if (a0 && document.querySelectorAll("[id^=mail]").length === parts.length) parts.forEach(function (p, i) { document.getElementById("mail" + i).setAttribute("href", mailto(w, p, i, parts.length)); });
    else if (a0) { var y = scrollY; app.innerHTML = send(w); scrollTo(0, y); var t = app.querySelector("[data-f=weeknote]"); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
  }
  document.addEventListener("input", function (ev) { var t = ev.target; if (t.type !== "checkbox" && t.tagName !== "SELECT") onField(ev); });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "importFile" && t.files && t.files[0]) { var fr = new FileReader(); fr.onload = function () { doImport(fr.result); }; fr.readAsText(t.files[0]); return; }
    if (t.type === "checkbox" || t.id === "startDate" || t.tagName === "SELECT") onField(ev);
  });
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]"); if (!b) return;
    var a = b.getAttribute("data-act"), c = ctx();
    if (a === "wk") { viewWeek = +b.getAttribute("data-w"); location.hash = "#/week/" + viewWeek; }
    else if (a === "feel" && c) { var r = rec(c.w, c.d, true); r.feel = r.feel === b.getAttribute("data-v") ? "" : b.getAttribute("data-v"); if (!r.date) r.date = todayStr(); save(); b.parentNode.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x.getAttribute("data-v") === r.feel); }); }
    else if (a === "finish" && c) finish(c.w, c.d);
    else if (a === "copy") copyText(weekParts(viewWeek).join("\n\n"));
    else if (a === "export") {
      var blob = new Blob([JSON.stringify(backupObj(), null, 1)], { type: "application/json" }), u = URL.createObjectURL(blob), l = document.createElement("a");
      l.href = u; l.download = "fitness-backup-" + PID + "-" + todayStr() + ".json"; document.body.appendChild(l); l.click(); setTimeout(function () { URL.revokeObjectURL(u); l.remove(); }, 1000); toast("Backup downloaded");
    }
    else if (a === "copybackup") copyText(JSON.stringify(backupObj()));
    else if (a === "importtext") doImport(document.getElementById("importText").value);
    else if (a === "reset") { if (confirm("Erase ALL of " + P.name + "'s workout log on this phone? (Download a backup first!)")) { localStorage.removeItem(KEY); S = load(); toast("Erased"); location.hash = "#/home"; render(); } }
  });
  window.addEventListener("hashchange", render);
  try { localStorage.setItem("kidStrength:lastKid", PID); } catch (e) {}
  render();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.SINGLE_FILE) navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
  window.__tracker = { weekParts: weekParts, mailto: mailto, state: function () { return S; } };
})();
</script></body></html>
