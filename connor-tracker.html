ef4444;--line:#e7dccb;--soft:#ffeeda;--radius:18px}
body.theme-colin{--bg:#eef3ff;--brand:#3b5bdb;--brand2:#7c3aed;--soft:#e2e9ff;--line:#d4dcf2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Comic Sans MS",sans-serif;padding-bottom:40px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--brand)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header.top{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 0 18px;border-radius:0 0 26px 26px;box-shadow:0 4px 14px rgba(0,0,0,.12);margin-bottom:14px}
header.top .row{display:flex;align-items:center;gap:10px}
header.top h1{font-size:26px;margin:0;line-height:1.15;flex:1}
header.top .sub{opacity:.95;font-size:16px;margin-top:4px}
.iconbtn{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:14px;min-width:52px;height:52px;font-size:24px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(30,30,60,.08);border:2px solid transparent}
.card h2{margin:0 0 8px;font-size:22px}
.card h3{margin:0;font-size:21px;line-height:1.2}
.muted{color:var(--muted);font-size:16px}
.small{font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:20px;padding:10px 16px;margin:8px 0;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.alt{background:var(--brand2)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.green{background:var(--ok)}
.btn.big{min-height:70px;font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.weekpick{display:flex;align-items:center;gap:10px}
.weekpick .lbl{flex:1;text-align:center}
.weekpick .lbl b{display:block;font-size:30px;line-height:1.1}
.weekpick button{width:64px;height:64px;border-radius:50%;border:0;background:var(--soft);font-size:30px;font-weight:900;color:var(--ink)}
.weekpick button:disabled{opacity:.3}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:800;background:var(--soft);color:var(--ink);margin:2px 4px 2px 0}
.badge.deload{background:#dbeafe;color:#1e40af}.badge.record{background:#fde68a;color:#7c2d12}.badge.base{background:#dcfce7;color:#14532d}
.sess{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:3px solid var(--line);background:#fff;border-radius:20px;padding:14px;margin:10px 0;min-height:88px}
.sess .emo{font-size:40px;width:56px;text-align:center}
.sess .t{flex:1}.sess .t b{font-size:22px;display:block}
.sess.done{border-color:var(--ok);background:#f0fdf4}
.sess .stk{font-size:34px}
.type-Lower{color:#c2410c}.type-Upper{color:#1d4ed8}
.bar{height:22px;background:var(--soft);border-radius:999px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px;transition:width .4s}
.stickers{font-size:30px;line-height:1.3;word-break:break-all;min-height:40px}
.check{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{width:32px;height:32px;flex:none;accent-color:var(--ok);margin:0}
.ex{border-color:var(--line)}
.ex.isdone{border-color:var(--ok);background:#f6fff8}
.ex .head{display:flex;gap:10px;align-items:flex-start}
.ex .head .num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:20px}
.target{font-size:28px;font-weight:900;margin:6px 0 2px;color:var(--brand)}
.target small{font-size:17px;font-weight:700;color:var(--ink)}
.howto{margin-top:8px}
.howto summary{list-style:none;font-weight:800;padding:12px 14px;background:var(--soft);border-radius:14px;min-height:50px;display:flex;align-items:center}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"▶";margin-right:10px;transition:transform .2s;display:inline-block}
.howto[open] summary::before{transform:rotate(90deg)}
.howto .body{padding:10px 6px 2px;font-size:17px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-top:12px}
.set{background:var(--soft);border-radius:14px;padding:8px;text-align:center}
.set label{display:block;font-size:14px;font-weight:800;color:var(--muted)}
.set input{width:100%;height:56px;font-size:26px;font-weight:800;text-align:center;border:2px solid var(--line);border-radius:12px;background:#fff;padding:0 4px}
.set input.wt{height:44px;font-size:19px;margin-top:6px}
body.theme-colin .set input.wt{height:56px;font-size:24px;margin-top:0;margin-bottom:6px;border-color:#9fb3ee}
.set input:focus,textarea:focus,.txt:focus{outline:3px solid var(--brand2);border-color:transparent}
.txt,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:18px;background:#fff;min-height:52px}
textarea{min-height:90px;resize:vertical}
.donebox{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:14px;background:#f1f5f9;font-weight:900;font-size:20px;min-height:60px}
.donebox input{width:36px;height:36px;accent-color:var(--ok);margin:0}
.challenge{border-color:#fbbf24;background:#fffbeb}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feel button{min-height:72px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:20px;font-weight:900}
.feel button span{display:block;font-size:28px}
.feel button.on[data-v=EASY]{background:#dcfce7;border-color:var(--ok)}
.feel button.on[data-v=OK]{background:#fef3c7;border-color:var(--warn)}
.feel button.on[data-v=HARD]{background:#fee2e2;border-color:var(--hard)}
pre.summary{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:14px;font-size:14px;line-height:1.4;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal .box{background:#fff;border-radius:26px;padding:26px 20px;text-align:center;max-width:360px;width:100%;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.modal .big{font-size:110px;line-height:1.1}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
.rules details{background:#fff;border-radius:16px;margin:10px 0;box-shadow:0 2px 8px rgba(30,30,60,.08)}
.rules summary{font-weight:900;font-size:20px;padding:16px;min-height:58px;cursor:pointer}
.rules .item{padding:0 16px 12px}
.rules .item b{display:block}
.rules details.safety{border:3px solid var(--hard)}
.saved{font-size:14px;color:var(--ok);font-weight:800;text-align:center;min-height:20px}
.kidpick{display:grid;gap:14px}
.kidpick a{display:flex;align-items:center;gap:16px;padding:22px;border-radius:24px;color:#fff;text-decoration:none;font-size:28px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.kidpick a span{font-size:54px}
.kidpick a small{display:block;font-size:16px;font-weight:600;opacity:.95}
.k-connor{background:linear-gradient(135deg,#ff7a1a,#14b8a6)}.k-colin{background:linear-gradient(135deg,#3b5bdb,#7c3aed)}
.row{display:flex;gap:10px;align-items:center}
.hidden{display:none!important}
.sessnote{background:var(--soft);border-radius:12px;padding:8px 12px;font-weight:700;margin-top:8px}
</style></head><body><div id='app'></div><div id='toast' class='toast' role='status'></div><script>window.KID='connor';window.SINGLE_FILE=true;window.PLANS={"connor":{"kid":"connor","name":"Connor","age":9,"theme":"connor","weightsFirst":false,"coachEmail":"justin.dodd@mail.grokbot.com","coachName":"Coach","title":"12-Week Beginner Strength Plan - Connor (age 9)","intro":"Upper/Lower split, 3 sessions/week, ~30 minutes. Mostly bodyweight plus form practice with a broomstick or very light loads. All targets are conservative starting points - adjust to what Connor can do with slow, controlled, good-form reps.","targetHeader":"Target version / load - suggested, adjust","warmup":[{"label":"1. Get warm (2 min)","text":"Jumping jacks, jog in place, skipping, or jump rope. Make it a game: 'Simon says' or follow-the-leader."},{"label":"2. Mobility (2 min)","text":"10 arm circles each way, 10 bodyweight squats, 5 inchworms, 5 bird dogs per side, 10 calf raises."},{"label":"3. Practice (1 min)","text":"5 slow practice reps of the first exercise with no weight (or a broomstick), focusing on form."}],"cooldown":[{"label":"Cool-down (3 min)","text":"Easy walk, then gentle stretches held 15-20 sec: quads, hamstrings, calves, chest in a doorway, child's pose. Give the sticker / checkmark!"}],"sections":[{"title":"GOALS","items":[{"label":"Primary goal","text":"Have fun, learn safe movement (squat, lunge, hinge, push, pull, core) and build a habit of moving and training with Dad."},{"label":"Secondary goal","text":"Slow, steady strength gains through more reps, slower reps and harder versions - NOT heavy weight. Good form always beats more reps or more weight."},{"label":"Starting numbers","text":"Unknown - so the plan starts conservatively. Week 1 is a BASELINE week: the numbers Connor writes down (reps, hold times, squats in 60 sec, max good-form push-ups, longest plank and hang) become his baseline. Targets will be adjusted after Justin sends back each week's results."},{"label":"Phases","text":"Weeks 1-4: LEARN (learn the movements, 1-2 sets; easy week in week 4)\nWeeks 5-8: BUILD (2-3 sets, harder versions; easy week in week 8)\nWeeks 9-12: CHALLENGE (2-3 sets, harder versions / tiny weight only if EASY; week 12 is a FUN REP-RECORD week compared to week 1 - bodyweight only, NO max lifts)."}]},{"title":"SCHEDULE","items":[{"label":"Days","text":"3 sessions per week (e.g., Mon / Wed / Fri, or fit around sports practices), about 30 minutes each."},{"label":"THE RULE","text":"Upper and Lower days can be done on back-to-back days (e.g., around practices), but NEVER do two of the same type (Upper + Upper or Lower + Lower) on consecutive days. Aim for at least one full rest day each week, and skip or go light on Lower day right before a game if legs are tired."},{"label":"Lower / Upper rotation","text":"Alternate Lower and Upper days. Odd weeks (1,3,5,7,9,11): Lower, Upper, Lower. Even weeks (2,4,6,8,10,12): Upper, Lower, Upper. The days keep alternating across weeks (L-U-L | U-L-U | L-U-L ...), and each day type is done 18 times over the 12 weeks."},{"label":"LOWER day","text":"Squat (box squat to bench to start) | Reverse lunge | Glute bridge | Broomstick hip hinge / RDL (form practice) | Leg extension (bench attachment, lightest setting) | Calf raises | Plank (+ side planks from week 5) | Fun challenge."},{"label":"UPPER day","text":"Push-ups (incline on rack bar -> bench -> floor) | One-arm row (empty dumbbell handle) | Lat pulldown (light) | Low cable row (light) | Overhead press (broomstick -> empty handles) | Dead hang (flexed-arm hang option from week 9) | Dead bug | Fun challenge."},{"label":"Session length (~30 min)","text":"5-min warm-up + ~20 min of exercises + 2-min fun challenge + 3-min cool-down. Rest 45-60 sec between sets. To save time, pair two exercises and go back and forth (e.g., squat then plank, push-ups then row)."}]},{"title":"5-MIN WARM-UP & 3-MIN COOL-DOWN","items":[{"label":"1. Get warm (2 min)","text":"Jumping jacks, jog in place, skipping, or jump rope. Make it a game: 'Simon says' or follow-the-leader."},{"label":"2. Mobility (2 min)","text":"10 arm circles each way, 10 bodyweight squats, 5 inchworms, 5 bird dogs per side, 10 calf raises."},{"label":"3. Practice (1 min)","text":"5 slow practice reps of the first exercise with no weight (or a broomstick), focusing on form."},{"label":"Cool-down (3 min)","text":"Easy walk, then gentle stretches held 15-20 sec: quads, hamstrings, calves, chest in a doorway, child's pose. Give the sticker / checkmark!"}]},{"title":"KEEP IT FUN","items":[{"label":"Stickers & checkmarks","text":"Each finished session = a sticker or checkmark on the weekly log. Each fun challenge = a bonus sticker. Finishing the 12 weeks = a celebration (Connor picks the reward)."},{"label":"Games & challenges","text":"Every session ends with a short fun challenge (bear crawls, wall sits, balance, wheelbarrow walk...). Let Connor pick the music, count reps out loud, or 'coach' Dad for a set."},{"label":"Record board","text":"Write week-1 baseline numbers on the Progress Log and compare them in week 12. Celebrate effort and good form, not just numbers."}]},{"title":"PROGRESSION RULES (small steps)","items":[{"label":"How it works","text":"Most exercises use 12-15 reps (or a time/per-side target). Keep the same version until ALL sets feel EASY with good form, then make ONE small change next session: add 1-2 reps, add a set, slow the lowering (3 sec), or move to the next harder version."},{"label":"Weight increases","text":"Only on the handle, machine and bench-attachment exercises, and only after all sets feel EASY with good form: +2.5 lb (or +1.25 lb per handle). Never add weight and reps at the same time. If form slips, go back to the last version."},{"label":"Sets","text":"1-2 sets in weeks 1-4, building to 2-3 sets in weeks 5-11. Main exercises reach 3 sets; small exercises stay at 1-2."},{"label":"Targets","text":"Targets in the plan are SUGGESTIONS ONLY. If a target feels HARD, stay at the previous version. If it feels too easy, still only make one small change."},{"label":"Easy (deload) weeks 4 and 8","text":"Fewer sets (usually 1-2) and easier versions so the body can recover and form stays sharp. Still fun challenges!"},{"label":"Week 12 - fun rep-record week","text":"Light week plus record tests compared to week 1: max good-form push-ups (same height as week 1), longest good-form plank, squats in 60 sec (same bench), longest dead hang. Bodyweight only. NO one-rep max tests, no heavy maxes, never to failure - stop the first time a rep isn't clean."}]},{"title":"SAFETY RULES","items":[{"label":"Adult supervision","text":"An adult supervises EVERY session. No training alone, and no using the bars, rack or plates without an adult."},{"label":"Form over weight","text":"Good form always wins. If form breaks down, end the set. Leave 2-3 reps 'in the tank' - nothing to failure."},{"label":"Stop if pain","text":"Stop immediately for sharp pain or any joint pain (knees, back, shoulders, elbows, wrists, heels). Normal muscle burn/tiredness is OK; pain is not. If pain continues, check with a doctor."},{"label":"No max testing","text":"No one-rep max (1RM) tests, ever. Progress is measured with good-form reps and hold times."},{"label":"Slow, controlled reps","text":"About 2-3 seconds down, controlled up. No bouncing, jerking or swinging."},{"label":"Hydrate & recover","text":"Water before, during and after. Sleep 9-12 hours per night. Regular meals with protein, fruits and vegetables. Rest days matter, especially on heavy practice weeks."},{"label":"Rack safeties set","text":"Keep the power rack safeties set (and pins locked) whenever the rack is used, including for incline push-ups on the bar. Keep heavy plates and bars stored and out of the way."},{"label":"Environment","text":"Clear floor space, flat stable shoes, no loose plates on the floor, adult close by at the pull-up bar and dip handles."}]},{"title":"EQUIPMENT NOTES","items":[{"label":"Mikolo F4 power rack + safeties","text":"Bar or safeties set at hip height = incline push-up station (lower it hole by hole as Connor gets stronger). Hold the upright for balance on lunges and calf raises. Safeties always set."},{"label":"Pull-up bar","text":"Dead hangs (adult lifts him up or he steps up from a sturdy box). From week 9, flexed-arm hang: step up so the chin is over the bar and hold. No band needed. Let go before the grip gives out."},{"label":"Plate-loaded lat pulldown & low cable row","text":"Start with NOTHING loaded - the handle/carriage still has some resistance. Write it down: ___ lb. Add 2.5 lb only when all sets feel EASY."},{"label":"Landmine","text":"Not used in this plan - it needs the 45 lb Olympic bar, which is too heavy for now."},{"label":"Dip handles","text":"Support holds only (3 x 5-10 sec, arms straight, shoulders down) as an occasional fun challenge from week 5. No dips yet. Skip if shoulders feel uncomfortable."},{"label":"Flat bench + leg extension attachment","text":"Bench = box-squat target, row support, and incline push-up station. Leg extension: lightest setting only to start (write the load: ___ lb), slow and controlled, +2.5 lb only when all sets feel EASY."},{"label":"35 lb bar & 45 lb Olympic bar","text":"Too heavy for now - DON'T USE. Use a broomstick for bar practice."},{"label":"EZ curl bar","text":"Probably too heavy too (most EZ bars weigh about 15-25 lb - weigh it: ___ lb). Not in the plan - only if comfortable later (light curls, good form)."},{"label":"Plate-loading dumbbell handles","text":"Weigh one empty handle: ___ lb (often ~3-6 lb). Used empty for rows, overhead press, goblet squats and RDLs. Add the smallest plate only when all sets feel EASY."},{"label":"Plates on hand","text":"2 x 45 lb, 4 x 10 lb, 4 x 5 lb. The 45 lb plate laid flat is the step for calf raises. 5 lb plates are too big a jump for a 9-year-old on most exercises."},{"label":"Fixed dumbbells 25s and 45s","text":"Too heavy - don't use."},{"label":"No TRX","text":"Not needed; incline push-ups on the rack bar and the pulldown/row cover pulling and pushing."}]},{"title":"SUGGESTED PURCHASES","items":[{"label":"Pair of 2.5 lb plates","text":"Recommended. Allows small +2.5 lb steps on the dumbbell handles, pulldown, cable row and leg extension. Very low cost."},{"label":"Nice to have: 1.25 lb plates","text":"Even smaller steps (e.g., +1.25 lb per handle on the overhead press)."},{"label":"Stickers + a small calendar","text":"For tracking sessions and fun challenges."}]}],"guide":[{"name":"Bird dog (warm-up)","day":"Warm-up","how":"On hands and knees, back flat like a table. Reach one arm forward and the opposite leg back, hold 2 sec without tipping, return and switch."},{"name":"Inchworm (warm-up)","day":"Warm-up","how":"Stand, fold forward and put hands on the floor, walk the hands out to a push-up position, then walk the feet up to the hands and stand."},{"name":"Box squat -> bodyweight squat -> goblet squat","day":"Lower","how":"Feet shoulder width, chest up. Sit back and down until you lightly touch the bench, then stand up tall - no plopping. Later: same squat without the bench, then with a pause, then holding one empty dumbbell handle at the chest (goblet) only if all sets feel EASY."},{"name":"Reverse lunge / split squat","day":"Lower","how":"Stand tall, step one foot back and lower the back knee gently toward the floor. Front knee stays over the middle of the foot. Push through the front heel to come back up. Hold the rack upright for balance at first. Split squat = feet stay in place, just go down and up."},{"name":"Glute bridge (and single-leg bridge)","day":"Lower","how":"Lie on your back, knees bent, feet flat. Squeeze your glutes and push through your heels to lift your hips until knees, hips and shoulders line up, pause, lower slowly. Single-leg: one foot up, same thing."},{"name":"Broomstick hip hinge / RDL","day":"Lower","how":"Hinge: broomstick along the back touching the head, upper back and tailbone. Soft knees, push hips BACK until you feel the back of the legs stretch, keep all 3 touch points, stand up by squeezing glutes. RDL: hold the stick (later 2 empty handles) at the thighs, slide it down to just below the knees with a flat back, stand up."},{"name":"Leg extension (bench attachment, light)","day":"Lower","how":"Sit on the bench with the pad on the front of the ankles. Slowly straighten the knees, squeeze for a second, and lower slowly - no kicking or swinging. Lightest setting to start."},{"name":"Calf raises","day":"Lower","how":"Hold the rack for balance. Rise up onto your toes, pause, lower slowly. Later: balls of feet on the edge of a 45 lb plate laid flat, then one leg at a time."},{"name":"Plank and side plank","day":"Lower","how":"Plank: forearms on the floor, body in a straight line head to heels, squeeze glutes and belly, breathe. Side plank: on one forearm and the side of the feet (or knees to make it easier), hips up in a straight line. Stop when hips sag."},{"name":"Push-ups (incline -> floor)","day":"Upper","how":"Hands on the rack bar/safeties (set at hip height, pins locked) a bit wider than shoulders, body straight like a plank. Lower your chest to the bar and push back up. Lower the bar one hole at a time, then hands on the bench, then the floor. Higher hands = easier."},{"name":"One-arm row (dumbbell handle)","day":"Upper","how":"One hand and the same-side knee on the bench, flat back. Hold an empty handle in the other hand, pull it up to the hip, squeeze the shoulder blade, lower slowly. Do all reps, then switch."},{"name":"Lat pulldown (light)","day":"Upper","how":"Grip the bar a little wider than shoulders. Pull it down to the upper chest by driving the elbows down, without leaning back or yanking, then let it rise slowly. Start with nothing loaded."},{"name":"Low cable row (light)","day":"Upper","how":"Sit tall with a slight knee bend. Pull the handle to your belly while squeezing your shoulder blades together, then let the arms straighten slowly. Start with nothing loaded."},{"name":"Overhead press (broomstick -> empty handles)","day":"Upper","how":"Stand tall, squeeze glutes, ribs down. Hold the broomstick (later 2 empty handles) at the shoulders, press straight up until arms are by the ears, lower slowly to the shoulders."},{"name":"Dead hang / flexed-arm hang","day":"Upper","how":"Dead hang: adult lifts him to the bar (or step up), hands shoulder width, arms long, shoulders pulled slightly away from ears, hold. Flexed-arm hang (week 9+): step up so the chin is over the bar, hold. Let go before the grip gives out and step down - don't drop."},{"name":"Dead bug","day":"Upper","how":"Lie on your back with arms reaching up and knees bent at 90 degrees. Keep the low back pressed into the floor and slowly reach the opposite arm and leg out, breathe out, return and switch sides."},{"name":"Dip-handle support hold (fun challenge)","day":"Upper","how":"Adult close by. Hands on the dip handles, jump or step up to straight arms, shoulders pushed DOWN away from the ears, hold 5-10 sec. No dipping. Skip if shoulders feel uncomfortable."},{"name":"Fun challenges","day":"Both","how":"Short games at the end of each session (bear crawl, crab walk, wall sit, balance, wheelbarrow walk, plank high-fives...). Good form beats speed. Each one earns a sticker or checkmark."}],"weeks":[{"week":1,"phase":"Learn - BASELINE WEEK","sessions":[{"num":1,"day":"Mon","type":"Lower","exercises":[{"name":"Squat","sets":2,"reps":"12","target":"Box squat - sit to bench, stand","cue":"Feet shoulder width, chest up, knees follow toes, sit back and down, stand tall. Move to the next version only after all sets feel EASY with good form.","guide":2},{"name":"Reverse lunge","sets":1,"reps":"8/leg","target":"Reverse lunge, hold rack for balance","cue":"Step back, back knee lowers gently toward floor, front knee over the middle of the foot, push up through front heel. Hold the rack if wobbly.","guide":3},{"name":"Glute bridge","sets":2,"reps":"12","target":"Glute bridge","cue":"Feet flat, push through heels, squeeze glutes at the top, ribs down, lower slowly.","guide":4},{"name":"Hip hinge / RDL (form practice)","sets":2,"reps":"12","target":"Broomstick on back (3 touch points)","cue":"Flat back, soft knees, push hips BACK, stick stays touching head/upper back/tailbone. This is form practice - slow and smooth.","guide":5},{"name":"Leg extension (bench attachment, light)","sets":1,"reps":"12","target":"Lightest setting = ___ lb","cue":"Slow: 2 sec up, squeeze, 3 sec down. No kicking. +2.5 lb only after all sets feel EASY with good form.","guide":6},{"name":"Calf raises","sets":2,"reps":"15","target":"On floor, hand on rack","cue":"Rise high onto toes, pause, lower slowly. Hold the rack for balance.","guide":7},{"name":"Plank","sets":2,"reps":"15-20 sec","target":"Forearm plank","cue":"Straight line head to heels, squeeze glutes and belly, breathe. Stop the hold when hips sag.","guide":8}],"challenge":{"name":"FUN CHALLENGE / BASELINE: Squats in 60 sec","sets":1,"reps":"Good-form reps in 60 sec","target":"Bodyweight, touch the SAME bench each rep","cue":"BASELINE TEST. Only count good reps (touch bench, stand tall). Note the bench height so week 12 is a fair comparison. Sticker!","guide":17},"note":null,"dayIndex":1},{"num":2,"day":"Wed","type":"Upper","exercises":[{"name":"Push-ups (incline -> floor)","sets":2,"reps":"10-12","target":"Hands on rack bar at hip height","cue":"Body straight like a plank, chest to the bar/bench, elbows at a 45-degree angle. Go lower only after all sets feel EASY with good form.","guide":9},{"name":"One-arm row (dumbbell handle)","sets":2,"reps":"12/arm","target":"Empty handle = ___ lb","cue":"One hand and knee on the bench, flat back. Pull the handle to the hip, squeeze, lower slowly.","guide":10},{"name":"Lat pulldown (light)","sets":1,"reps":"12","target":"Nothing loaded = ___ lb","cue":"Pull bar to upper chest, elbows down, no leaning back or yanking, slow up.","guide":11},{"name":"Low cable row (light)","sets":1,"reps":"12","target":"Nothing loaded = ___ lb","cue":"Sit tall, pull to belly, squeeze shoulder blades, 2 sec return.","guide":12},{"name":"Overhead press (form practice)","sets":2,"reps":"12","target":"Broomstick","cue":"Stand tall, squeeze glutes, ribs down, press straight up, lower slowly to shoulders.","guide":13},{"name":"Dead hang - BASELINE TEST","sets":1,"reps":"Longest good hang (sec)","target":"Dead hang, adult helps reach bar","cue":"TEST: Adult lifts him to the bar or uses a step. Arms long, shoulders 'away from ears'. Let go before grip gives out; step down, don't drop.","guide":14},{"name":"Dead bug (core)","sets":2,"reps":"6/side","target":"Dead bug","cue":"Low back pressed into the floor. Slowly reach opposite arm and leg out, breathe out, return, switch.","guide":15}],"challenge":{"name":"FUN CHALLENGE / BASELINE: Max push-ups","sets":1,"reps":"Max GOOD-FORM reps","target":"Hands on rack bar at ___ height (write it)","cue":"BASELINE TEST. Stop the set the first time a rep isn't clean (hips sag, half rep). Never to failure. Sticker!","guide":17},"note":null,"dayIndex":2},{"num":3,"day":"Fri","type":"Lower","exercises":[{"name":"Squat","sets":2,"reps":"12","target":"Box squat - sit to bench, stand","cue":"Feet shoulder width, chest up, knees follow toes, sit back and down, stand tall. Move to the next version only after all sets feel EASY with good form.","guide":2},{"name":"Reverse lunge","sets":1,"reps":"8/leg","target":"Reverse lunge, hold rack for balance","cue":"Step back, back knee lowers gently toward floor, front knee over the middle of the foot, push up through front heel. Hold the rack if wobbly.","guide":3},{"name":"Glute bridge","sets":2,"reps":"12","target":"Glute bridge","cue":"Feet flat, push through heels, squeeze glutes at the top, ribs down, lower slowly.","guide":4},{"name":"Hip hinge / RDL (form practice)","sets":2,"reps":"12","target":"Broomstick on b (function () {
  "use strict";
  var KID = window.KID || "connor";
  var P = (window.PLANS || {})[KID];
  var app = document.getElementById("app");
  if (!P) { app.innerHTML = "<p style='padding:20px'>Plan data missing.<\/p>"; return; }
  document.body.classList.add("theme-" + P.theme);
  var KEY = "kidStrength:v1:" + KID;
  var STICKERS = ["🦖","🚀","⚡","🦈","🐯","🔥","🏆","🦅","🐉","⭐","🦍","🏈","⚽","🥇","🦁","🐺","🛡️","💎","🌋","🐙","🦄","🎯","🏀","🦊","🐻","🛹","🥷","🤖","🐲","🌟","🦬","⚾","🎸","🏅","👑","🎉"];
  var FEEL = [["EASY","😎"],["OK","🙂"],["HARD","😅"]];
  var S = load();
  var viewWeek = null;

  function load() { try { var s = JSON.parse(localStorage.getItem(KEY) || "{}"); if (s && typeof s === "object") { s.sessions = s.sessions || {}; s.weekNotes = s.weekNotes || {}; return s; } } catch (e) {} return { sessions: {}, weekNotes: {} }; }
  var saveTimer;
  function save(quiet) {
    S.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem("kidStrength:lastKid", KID); } catch (e) { toast("Could not save! Storage full?"); }
    if (!quiet) { var el = document.getElementById("saved"); if (el) { el.textContent = "✓ Saved"; clearTimeout(saveTimer); saveTimer = setTimeout(function () { el.textContent = ""; }, 1200); } }
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function sk(w, d) { return "w" + w + "d" + d; }
  function rec(w, d, create) { var k = sk(w, d); if (!S.sessions[k] && create) S.sessions[k] = { warm: {}, ex: {}, ch: {}, feel: "", notes: "" }; return S.sessions[k]; }
  function week(w) { return P.weeks[w - 1]; }
  function sess(w, d) { return week(w).sessions[d - 1]; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parseDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmtShort(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }
  function currentWeek() {
    var st = parseDate(S.startDate);
    if (st) { var n = new Date(); n.setHours(0, 0, 0, 0); var w = Math.floor((n - st) / 864e5 / 7) + 1; return Math.min(12, Math.max(1, w)); }
    for (var w2 = 1; w2 <= 12; w2++) for (var d = 1; d <= 3; d++) { var r = rec(w2, d); if (!r || !r.finished) return w2; }
    return 12;
  }
  function weekDates(w) { var st = parseDate(S.startDate); if (!st) return ""; var a = new Date(st); a.setDate(a.getDate() + (w - 1) * 7); var b = new Date(a); b.setDate(b.getDate() + 6); return fmtShort(a) + " - " + fmtShort(b); }
  function isChallengeDone(r) { return !!(r && r.ch && (r.ch.done || (r.ch.res || "").trim())); }
  function stats() {
    var done = 0, stk = [];
    for (var w = 1; w <= 12; w++) for (var d = 1; d <= 3; d++) {
      var r = rec(w, d); if (!r) continue;
      if (r.finished) { done++; stk.push(STICKERS[(sess(w, d).num - 1) % STICKERS.length]); }
      if (sess(w, d).challenge && isChallengeDone(r)) stk.push("⭐");
    }
    return { done: done, stickers: stk };
  }
  function phaseBadges(wk) {
    var h = "<span class='badge'>" + esc(wk.phase.split(" - ")[0]) + "<\/span>";
    if (wk.deload) h += "<span class='badge deload'>😌 Easy week<\/span>";
    if (wk.record) h += "<span class='badge record'>🏆 Record week<\/span>";
    if (wk.baseline) h += "<span class='badge base'>📏 Baseline week<\/span>";
    return h;
  }
  function typeEmoji(t) { return t === "Lower" ? "🦵" : "💪"; }
  function noWeight(ex) { return isTime(ex.reps) || /plank|dead bug|hang|push-up/i.test(ex.name); }
  function isTime(reps) { return /sec|\d\s*s\b|hold/i.test(reps); }
  function shortName(n) { return String(n).replace(/\s*\([^)]*\)/g, "").replace(/\s*-\s*SPOTTER/i, "").replace(/^FUN CHALLENGE(\s*\/\s*)?:?\s*/i, "").trim(); }
  function header(title, sub, back) {
    return "<header class='top'><div class='wrap'><div class='row'>" +
      (back ? "<a class='iconbtn' href='" + back + "' aria-label='Back'>⬅<\/a>" : "") +
      "<h1>" + title + "<\/h1>" +
      (back ? "" : "<a class='iconbtn' href='#/rules' aria-label='Rules and safety'>🛟<\/a>") +

  }

  /* ---------------- HOME ---------------- */
  function home(w) {
    w = w || viewWeek || currentWeek(); viewWeek = w;
    var wk = week(w), st = stats(), cw = currentWeek();
    var h = header("Hi " + esc(P.name) + "! " + (P.kid === "colin" ? "🏋️" : "💪"), "12-week strength plan • " + st.done + " of 36 workouts done");
    h += "<main class='wrap'>";
    h += "<div class='card'><div class='weekpick'><button data-act='wk' data-w='" + (w - 1) + "' " + (w <= 1 ? "disabled" : "") + " aria-label='Previous week'>‹<\/button>" +
      "<div class='lbl'><span class='muted'>WEEK<\/span><b id='weeknum'>" + w + " <span class='muted' style='font-size:18px'>of 12<\/span><\/b>" +

      "<button data-act='wk' data-w='" + (w + 1) + "' " + (w >= 12 ? "disabled" : "") + " aria-label='Next week'>›<\/button><\/div>" +
      "<div style='text-align:center;margin-top:8px'>" + phaseBadges(wk) + "<\/div>" +
