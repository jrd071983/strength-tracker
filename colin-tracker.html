body.theme-colin{--bg:#eef3ff;--brand:#3b5bdb;--brand2:#7c3aed;--soft:#e2e9ff;--line:#d4dcf2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Comic Sans MS",sans-serif;padding-bottom:40px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--brand)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header.top{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 0 18px;border-radius:0 0 26px 26px;box-shadow:0 4px 14px rgba(0,0,0,.12);margin-bottom:14px}
header.top .row{display:flex;align-items:center;gap:10px}
header.top h1{font-size:26px;margin:0;line-height:1.15;flex:1}
header.top .sub{opacity:.95;font-size:16px;margin-top:4px}
.iconbtn{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:14px;min-width:52px;height:52px;font-size:24px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(30,30,60,.08);border:2px solid transparent}
.card h2{margin:0 0 8px;font-size:22px}
.card h3{margin:0;font-size:21px;line-height:1.2}
.muted{color:var(--muted);font-size:16px}
.small{font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:20px;padding:10px 16px;margin:8px 0;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.alt{background:var(--brand2)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.green{background:var(--ok)}
.btn.big{min-height:70px;font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.weekpick{display:flex;align-items:center;gap:10px}
.weekpick .lbl{flex:1;text-align:center}
.weekpick .lbl b{display:block;font-size:30px;line-height:1.1}
.weekpick button{width:64px;height:64px;border-radius:50%;border:0;background:var(--soft);font-size:30px;font-weight:900;color:var(--ink)}
.weekpick button:disabled{opacity:.3}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:800;background:var(--soft);color:var(--ink);margin:2px 4px 2px 0}
.badge.deload{background:#dbeafe;color:#1e40af}.badge.record{background:#fde68a;color:#7c2d12}.badge.base{background:#dcfce7;color:#14532d}
.sess{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:3px solid var(--line);background:#fff;border-radius:20px;padding:14px;margin:10px 0;min-height:88px}
.sess .emo{font-size:40px;width:56px;text-align:center}
.sess .t{flex:1}.sess .t b{font-size:22px;display:block}
.sess.done{border-color:var(--ok);background:#f0fdf4}
.sess .stk{font-size:34px}
.type-Lower{color:#c2410c}.type-Upper{color:#1d4ed8}
.bar{height:22px;background:var(--soft);border-radius:999px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px;transition:width .4s}
.stickers{font-size:30px;line-height:1.3;word-break:break-all;min-height:40px}
.check{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{width:32px;height:32px;flex:none;accent-color:var(--ok);margin:0}
.ex{border-color:var(--line)}
.ex.isdone{border-color:var(--ok);background:#f6fff8}
.ex .head{display:flex;gap:10px;align-items:flex-start}
.ex .head .num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:20px}
.target{font-size:28px;font-weight:900;margin:6px 0 2px;color:var(--brand)}
.target small{font-size:17px;font-weight:700;color:var(--ink)}
.howto{margin-top:8px}
.howto summary{list-style:none;font-weight:800;padding:12px 14px;background:var(--soft);border-radius:14px;min-height:50px;display:flex;align-items:center}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"▶";margin-right:10px;transition:transform .2s;display:inline-block}
.howto[open] summary::before{transform:rotate(90deg)}
.howto .body{padding:10px 6px 2px;font-size:17px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-top:12px}
.set{background:var(--soft);border-radius:14px;padding:8px;text-align:center}
.set label{display:block;font-size:14px;font-weight:800;color:var(--muted)}
.set input{width:100%;height:56px;font-size:26px;font-weight:800;text-align:center;border:2px solid var(--line);border-radius:12px;background:#fff;padding:0 4px}
.set input.wt{height:44px;font-size:19px;margin-top:6px}
body.theme-colin .set input.wt{height:56px;font-size:24px;margin-top:0;margin-bottom:6px;border-color:#9fb3ee}
.set input:focus,textarea:focus,.txt:focus{outline:3px solid var(--brand2);border-color:transparent}
.txt,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:18px;background:#fff;min-height:52px}
textarea{min-height:90px;resize:vertical}
.donebox{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:14px;background:#f1f5f9;font-weight:900;font-size:20px;min-height:60px}
.donebox input{width:36px;height:36px;accent-color:var(--ok);margin:0}
.challenge{border-color:#fbbf24;background:#fffbeb}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feel button{min-height:72px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:20px;font-weight:900}
.feel button span{display:block;font-size:28px}
.feel button.on[data-v=EASY]{background:#dcfce7;border-color:var(--ok)}
.feel button.on[data-v=OK]{background:#fef3c7;border-color:var(--warn)}
.feel button.on[data-v=HARD]{background:#fee2e2;border-color:var(--hard)}
pre.summary{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:14px;font-size:14px;line-height:1.4;max-height:50vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal .box{background:#fff;border-radius:26px;padding:26px 20px;text-align:center;max-width:360px;width:100%;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.modal .big{font-size:110px;line-height:1.1}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
.rules details{background:#fff;border-radius:16px;margin:10px 0;box-shadow:0 2px 8px rgba(30,30,60,.08)}
.rules summary{font-weight:900;font-size:20px;padding:16px;min-height:58px;cursor:pointer}
.rules .item{padding:0 16px 12px}
.rules .item b{display:block}
.rules details.safety{border:3px solid var(--hard)}
.saved{font-size:14px;color:var(--ok);font-weight:800;text-align:center;min-height:20px}
.kidpick{display:grid;gap:14px}
.kidpick a{display:flex;align-items:center;gap:16px;padding:22px;border-radius:24px;color:#fff;text-decoration:none;font-size:28px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.kidpick a span{font-size:54px}
.kidpick a small{display:block;font-size:16px;font-weight:600;opacity:.95}
.k-connor{background:linear-gradient(135deg,#ff7a1a,#14b8a6)}.k-colin{background:linear-gradient(135deg,#3b5bdb,#7c3aed)}
.row{display:flex;gap:10px;align-items:center}
.hidden{display:none!important}

</style></head><body><div id='app'></div><div id='toast' class='toast' role='status'></div><script>window.KID='colin';window.SINGLE_FILE=true;window.PLANS={"colin":{"kid":"colin","name":"Colin","age":12,"theme":"colin","weightsFirst":true,"coachEmail":"justin.dodd@mail.grokbot.com","coachName":"Colin Fitness","title":"12-Week Beginner Strength Plan - Youth Lifter (age 12)","intro":"Upper/Lower split, 3 sessions/week, ~40 minutes. All target weights are suggested starting points - adjust to what the athlete can move with slow, controlled, good-form reps.","targetHeader":"Target Weight (lb) - suggested, adjust","warmup":[{"label":"1. Get warm (2 min)","text":"Easy jumping jacks, jog in place, or jump rope."},{"label":"2. Mobility (2 min)","text":"10 bodyweight squats, 10 arm circles each way, 10 hip hinges (hands on hips, push hips back), 5 inchworms or cat-cows, 1 set of 10-12 glute bridges."},{"label":"LOWER day extra","text":"Add 1 light set of 8 goblet squats holding one Bowflex dumbbell set to 10 lb at the chest (warm-up only, not a working set)."},{"label":"3. Practice sets (1 min)","text":"Before the first squat and first press: 1 light practice set of 5 with just the bar (or a broomstick/PVC) focusing on form."}],"cooldown":[],"sections":[{"title":"GOALS","items":[{"label":"Primary goal","text":"Learn safe, consistent technique on the basic movements (squat, press, row, pull, hinge, core) and build a habit of training."},{"label":"Secondary goal","text":"Gradual strength gains using small, controlled weight jumps. Rep quality always beats weight on the bar."},{"label":"Starting numbers","text":"Bench 30 x ~8 (empty 30 lb bar) | Curl ~10 x ~6 | Week 1 Day 1 (Oct 26): squat 30x12, 45x15, 50x10 | RDL 30x8x3 | calf raises 30x15x2."},{"label":"TARGETS RAISED (Oct 26)","text":"After Week 1 Day 1, targets were raised from Week 1 Day 3 on: squat 45 lb (empty Olympic bar), RDL 35 lb, calf raises 30 lb. Bench unchanged."},{"label":"Phases","text":"Weeks 1-4: TECHNIQUE (learn the movements; deload in week 4)\nWeeks 5-8: BUILD (small weight increases; deload in week 8)\nWeeks 9-12: STRENGTH (slightly lower reps, slightly heavier; week 12 is a light 'show what you've learned' week with rep-PR tests - NO one-rep max tests)."}]},{"title":"SCHEDULE","items":[{"label":"Days","text":"3 sessions per week (e.g., Mon / Wed / Fri, or fit around practices). Upper and Lower days can be done back to back (e.g., around practices). Try not to do two of the same day in a row, and aim for at least one rest day each week; skip or go light on Lower day right before a game if legs are tired."},{"label":"Lower / Upper rotation","text":"Alternate Lower and Upper days. Odd weeks (1,3,5,7,9,11): Lower, Upper, Lower. Even weeks (2,4,6,8,10,12): Upper, Lower, Upper. Each day type is done 18 times over the 12 weeks."},{"label":"LOWER day","text":"Warm-up incl. 10-12 glute bridges + 1 light set of 8 goblet squats (Bowflex 10 lb) | Squat (45 lb Olympic bar) 3x8-10 | Romanian deadlift (30 lb bar + plates) 3x8 | Leg extensions (light) 2x12-15 | Calf raises (30 lb held) 2x15-20 | Plank 3x20-30 sec."},{"label":"UPPER day","text":"Bench press (30 lb bar) 3x6-10 WITH SPOTTER | Low cable row (light) 3x10 | Lat pulldown (light) 3x10 | Landmine press (45 lb Olympic bar in landmine) 2x8 per arm | Push-ups (hands on bench if needed) 2 x as many clean reps as possible | Dumbbell curls (Bowflex) 2x10-12 | Triceps pushdowns (lat pulldown cable, light) 2x12 | Dead bug 2x8/side."},{"label":"Session length","text":"About 40 minutes: 5-min warm-up + ~30 min lifting + a few minutes to cool down / stretch. Rest 60-90 sec between sets (up to 2 min on squat and bench)."}]},{"title":"5-MINUTE WARM-UP (every session)","items":[{"label":"1. Get warm (2 min)","text":"Easy jumping jacks, jog in place, or jump rope."},{"label":"2. Mobility (2 min)","text":"10 bodyweight squats, 10 arm circles each way, 10 hip hinges (hands on hips, push hips back), 5 inchworms or cat-cows, 1 set of 10-12 glute bridges."},{"label":"LOWER day extra","text":"Add 1 light set of 8 goblet squats holding one Bowflex dumbbell set to 10 lb at the chest (warm-up only, not a working set)."},{"label":"3. Practice sets (1 min)","text":"Before the first squat and first press: 1 light practice set of 5 with just the bar (or a broomstick/PVC) focusing on form."}]},{"title":"PROGRESSION RULES (double progression)","items":[{"label":"How it works","text":"Each exercise has a rep RANGE (e.g., 3x8-10). Keep the same weight until the athlete hits the TOP of the range on ALL sets with good form. Then add the smallest increment next session and work back up the range."},{"label":"Barbell increments","text":"Add 5 lb total (a 2.5 lb plate per side). If a jump feels too big, stay at the weight longer and add reps."},{"label":"Dumbbell increments","text":"Bowflex SelectTech dumbbells adjust in 2.5 lb steps - add 2.5 lb at a time on curls; calf raises go up 2.5-5 lb at a time from 30 lb."},{"label":"Machine increments","text":"Add the smallest plate (2.5 lb) on the pulldown/row/leg extension."},{"label":"Bench press start","text":"Start with the empty 30 lb bar for 3x6-8. Build reps to 3x10 at 30 lb before adding ANY weight. Then add 5 lb and drop back to 6-8 reps."},{"label":"Target weights","text":"Target Weight numbers in the plan are SUGGESTIONS ONLY based on typical progress. If a target feels heavy or form slips, stay at the previous weight. If it feels too easy, still only add the smallest increment."},{"label":"Deload weeks (4 and 8)","text":"Easier week to let the body recover: about 2 sets instead of 3 and/or ~10-15% lighter. Week 4 keeps the same weights with fewer sets (the empty bars can't go lighter); week 8 drops squat to 50 and RDL to 40."},{"label":"Week 12 - rep-record week","text":"Light week. A rep-record (rep-PR) test = one set at a moderate, known weight for as many CLEAN reps as possible (stop when form starts to slow or change, never to failure). NO one-rep max tests, ever."},{"label":"Bar loading - squat","text":"Squats use the 45 lb Olympic bar (45 = empty). 50 = +2.5/side | 55 = +5 | 60 = +5+2.5 | 65 = +10 | 70 = +10+2.5."},{"label":"Bar loading - RDL","text":"RDL uses the 30 lb bar. 35 = +2.5/side | 40 = +5 | 45 = +5+2.5 | 50 = +10 | 55 = +10+2.5."}]},{"title":"SAFETY RULES","items":[{"label":"Adult supervision","text":"An adult supervises EVERY session. No lifting alone."},{"label":"Spotter on bench","text":"Always have an adult spotter for bench press. Set the power rack safeties just below the bottom of the movement for squats and bench."},{"label":"No max testing","text":"No one-rep max (1RM) tests. Progress is measured with reps at a given weight."},{"label":"Slow, controlled reps","text":"About 2-3 seconds down, controlled up. No bouncing, jerking, or swinging. Every rep should look the same."},{"label":"Stop for pain","text":"Stop immediately for sharp pain or any joint pain (knees, back, shoulders, elbows, wrists). Normal muscle burn/tiredness is OK; pain is not. If pain continues, check with a doctor."},{"label":"Form first","text":"If form breaks down, end the set. Leave 1-2 reps 'in the tank' on every set."},{"label":"Recovery","text":"Sleep 9-11 hours per night. Eat regular meals with a protein source (eggs, milk, yogurt, meat, fish, beans) at each meal, plus fruits, vegetables and water. Rest days matter."},{"label":"Environment","text":"Clear floor space, good shoes (flat, stable), collars on the bar, water available."}]},{"title":"EQUIPMENT NOTES","items":[{"label":"30 lb barbell","text":"Bench press and Romanian deadlift (see Bar loading)."},{"label":"45 lb Olympic bar","text":"Squat bar from Week 1 Day 3 (45 lb empty). Move it to the rack for Lower days and back to the landmine for Upper days."},{"label":"Bowflex SelectTech 52 adjustable dumbbells","text":"5-52.5 lb per hand in 2.5 lb steps. Used for curls (start 7.5 lb each), calf raises (from 30 lb) and the warm-up goblet squat (10 lb). DIAL RULE: always change the weight with the dumbbell sitting in its tray, and set BOTH dials to the same number before lifting it out."},{"label":"EZ curl bar","text":"15 lb. Alternative for curls once 2x12 with the 7.5 lb Bowflex dumbbells is clean (15 lb EZ bar = about the same as 7.5 lb in each hand)."},{"label":"Plates on hand","text":"2 x 45 lb, 2 x 25 lb, 8 x 10 lb, 4 x 5 lb, plus 2.5 lb plates for 5 lb barbell jumps. A 45 lb plate laid flat can serve as the step for calf raises."},{"label":"Other dumbbells","text":"9 lb plate-loading handles (backup) and fixed 25s/45s (too heavy for now) - use the Bowflex dumbbells."},{"label":"Power rack with safeties","text":"Use for squats and bench press (bench set inside the rack) with safeties set. Rack pins can also be used as an adjustable incline push-up station."},{"label":"Pull-up bar","text":"Optional: dead hangs (10-20 sec) at the end of Upper day for grip and shoulders."},{"label":"Plate-loaded lat pulldown & low cable row","text":"Start light (10 lb). Note the machine's starting resistance may be more than zero. The pulldown cable is also used for triceps pushdowns (lightest load = ___ lb)."},{"label":"Landmine","text":"Holds the 45 lb Olympic bar for landmine press. Load felt is much less than the bar's weight (only one end is lifted)."},{"label":"Flat bench","text":"Used for bench press (inside the power rack with safeties set and an adult spotter). The bench edge is also the first incline push-up position."},{"label":"Leg extension attachment","text":"On the flat bench. Load is unknown - start with the lightest setting (empty pin, or 5 lb if it is plate-loadable). WEIGH / NOTE the starting load before week 1: ______ lb. Light work only: 2x12-15, slow and controlled, add 2.5 lb only when 2x15 is easy."}]},{"title":"SUGGESTED PURCHASES","items":[{"label":"Optional: 1.25 lb fractional plates","text":"Allows 2.5 lb total jumps for the bench press later on."}]}],"guide":[{"name":"Glute bridge (warm-up)","day":"Warm-up","how":"Lie on your back, knees bent, feet flat. Squeeze your glutes and push through your heels to lift your hips until knees, hips and shoulders line up, pause, then lower slowly."},{"name":"Goblet squat (warm-up, Bowflex 10 lb)","day":"Lower","how":"Hold one Bowflex dumbbell set to 10 lb against your chest with both hands, like holding a goblet. Sit down between your heels with chest up and elbows inside the knees, then stand up."},{"name":"Squat (45 lb Olympic bar)","day":"Lower","how":"Use the 45 lb Olympic bar in the rack (add plates per the Bar loading notes). Bar rests on the upper back with safeties set. Feet about shoulder width, chest up, sit hips down and back until at least parallel, knees tracking over toes, then drive up."},{"name":"Romanian deadlift (30 lb bar + plates)","day":"Lower","how":"Use the 30 lb bar with small plates (see Bar loading). Stand tall holding the bar at the thighs with soft knees. Keep a flat back and push your hips back so the bar slides down the legs to just below the knees, then squeeze the glutes to stand up - slow and controlled."},{"name":"Leg extensions (light)","day":"Lower","how":"Sit on the bench with the pad on the front of the ankles. Slowly straighten the knees, squeeze for a second, and lower slowly - no kicking or swinging."},{"name":"Calf raises","day":"Lower","how":"Stand with the balls of your feet on the edge of a step or a 45 lb plate. Rise up onto your toes, pause, then lower your heels slowly a little below the step. Hold one dumbbell (Bowflex set to 30 lb) at your side and use the other hand for balance; add 2.5-5 lb once 2x20 is clean."},{"name":"Plank","day":"Lower","how":"Forearms on the floor, body in a straight line from head to heels. Squeeze glutes and abs and breathe; stop when the hips sag."},{"name":"Bench press (30 lb bar)","day":"Upper","how":"Lie on the bench inside the rack with safeties set and an adult spotter. Lower the bar with control to the middle of the chest, elbows slightly tucked, then press back up over the shoulders."},{"name":"Low cable row (light)","day":"Upper","how":"Sit tall with a slight knee bend. Pull the handle to your belly while squeezing your shoulder blades together, then let the arms straighten slowly."},{"name":"Lat pulldown (light)","day":"Upper","how":"Grip the bar a little wider than shoulders. Pull it down to the upper chest by driving the elbows down, without leaning back or yanking, then let it rise slowly."},{"name":"Landmine press (45 lb Olympic bar in landmine)","day":"Upper","how":"One end of the 45 lb Olympic barbell sits in the rack's landmine pivot. Hold the other end at shoulder height with one hand, stand tall with ribs down, and press up and forward until the arm is straight, then lower slowly; do all reps, then switch arms. Because the bar is anchored, the athlete only lifts part of its weight, much less than 45 lb. If one arm feels wobbly at first, hold the end of the bar with both hands at the chest and press up and out, then switch to one arm once steady."},{"name":"Push-ups (hands on bench if needed)","day":"Upper","how":"Hands a bit wider than shoulders, body straight like a plank. Lower your chest to the bench, rack pin or floor and push back up; the higher the hands, the easier it is."},{"name":"Dumbbell curls (Bowflex)","day":"Upper","how":"Set both dials to the same weight with the dumbbells in the tray, then stand tall with elbows pinned to your sides. Curl the weights up toward the shoulders and lower slowly - no swinging; the 15 lb EZ bar can be used instead once ready."},{"name":"Triceps pushdown (lat pulldown cable, light)","day":"Upper","how":"Stand facing the pulldown cable holding the bar or handle with elbows tucked at your sides. Push down until your arms are straight, then let it come back up slowly without moving the elbows."},{"name":"Dead bug","day":"Upper","how":"Lie on your back with arms reaching up and knees bent at 90 degrees. Keep the low back pressed into the floor and slowly reach the opposite arm and leg out, then return and switch sides."}],"weeks":[{"week":1,"phase":"Technique","sessions":[{"num":1,"day":"Mon","type":"Lower","exercises":[{"name":"Squat (30 lb bar, in rack)","sets":3,"reps":"8-10","target":"30 lb","cue":"DONE Oct 26 (old plan): 30x12, 45x15, 50x10 - targets raised from here.","guide":2,"weight":30},{"name":"Romanian deadlift (30 lb bar)","sets":3,"reps":"8","target":"30 lb","cue":"DONE Oct 26: 30 x 8 x 3 - targets raised from here.","guide":3,"weight":30},{"name":"Leg extensions (light)","sets":2,"reps":"12-15","target":"Lightest (empty pin / 5 lb) = ___ lb","cue":"Slow and controlled (2 sec up, 1 sec squeeze, 3 sec down), no kicking. Note starting load. +2.5 lb only when 2x15 is easy.","guide":4},{"name":"Calf raises","sets":2,"reps":"15-20","target":"Bodyweight (done at 30 lb x 15)","cue":"Balls of feet on a step or 45 lb plate; hold the weight (Bowflex set to 30) at one side, other hand on the rack for balance. Rise onto toes, pause 1 sec, lower slowly below level. 2x20 clean -> +2.5-5 lb.","guide":5},{"name":"Plank","sets":3,"reps":"20 sec","target":"Bodyweight","cue":"Straight line head to heels, squeeze glutes and abs. Stop if hips sag.","guide":6}],"challenge":null,"note":"Warm-up + glute bridges, 8 goblet squats (10 lb)","dayIndex":1},{"num":2,"day":"Wed","type":"Upper","exercises":[{"name":"Bench press (30 lb bar) - SPOTTER","sets":3,"reps":"6-8","target":"30 lb","cue":"Spotter + safeties. Stay on empty 30 lb bar until 3x10 is solid, THEN +5 lb and back to 6-8 reps.","guide":7,"weight":30},{"name":"Low cable row (light)","sets":3,"reps":"10","target":"10 lb","cue":"Tall chest, pull handle to belly, squeeze shoulder blades, 2 sec return. 3x10 easy -> +2.5-5 lb.","guide":8,"weight":10},{"name":"Lat pulldown (light)","sets":3,"reps":"10","target":"10 lb","cue":"Pull bar to upper chest, elbows down, no leaning back or yanking. 3x10 easy -> +2.5-5 lb.","guide":9,"weight":10},{"name":"Landmine press (45 lb Olympic bar in landmine)","sets":2,"reps":"8/arm","target":"Bar only","cue":"Stand tall, press up and slightly forward, ribs down. Add plates only when 2x8/arm is easy.","guide":10},{"name":"Push-ups (hands on bench if needed)","sets":2,"reps":"AMRAP clean","target":"Hands on bench","cue":"Body straight like a plank, chest to bench/pin/floor. Stop the set when a rep isn't clean. Go lower when 2 sets of 12+ are clean.","guide":11},{"name":"Dumbbell curls (Bowflex)","sets":2,"reps":"10-12","target":"7.5 each","cue":"Both dials same number, set in the tray. Elbows pinned, no swinging. 2x12 clean -> +2.5 lb. Alt: 15 lb EZ bar once ready.","guide":12},{"name":"Triceps pushdowns (lat pulldown cable, light)","sets":2,"reps":"12-15","target":"Lightest = ___ lb","cue":"Elbows pinned to sides, push down until arms straight, slow return. Note starting load. +2.5 lb when 2x15 is easy.","guide":9},{"name":"Dead bug","sets":2,"reps":"8/side","target":"Bodyweight","cue":"Low back pressed into floor; slowly reach opposite arm and leg out, return, switch sides. Breathe out as you reach.","guide":14}],"challenge":null,"note":null,"dayIndex":2},{"num":3,"day":"Fri","type":"Lower","exercises":[{"name":"Squat (45 lb Olympic bar, in rack)","sets":3,"reps":"8-10","target":"45 lb","cue":"Safeties set. Chest up, knees track over toes, hips to at least parallel. All sets at top reps -> +5 lb next time. Load: empty 45 lb Olympic bar.","guide":2,"weight":45},{"name":"Romanian deadlift (30 lb bar + plates)","sets":3,"reps":"8","target":"35 lb","cue":"Flat back, push hips back, bar to just below knees, slow and controlled. 3x10 clean with a flat back -> +5 lb. Load: 30 lb bar + 2.5/side.","guide":3,"weight":35},{"name":"Leg extensions (light)","sets":2,"reps":"12-15","target":"Lightest (empty pin / 5 lb) = ___ lb","cue":"Slow and controlled (2 sec up, 1 sec squeeze, 3 sec down), no kicking. Note starting load. +2.5 lb only when 2x15 is easy.","guide":4},{"name":"Calf raises","sets":2,"reps":"15-20","target":"30 lb (dumb         "<div class='small' style='margin-top:6px'><b>🎯 " + esc(c.reps) + " • " + esc(c.target) + "<\/b><\/div><p class='small muted'>" + esc(c.cue) + "<\/p>" +
        (g2 && /Dip-handle/.test(g2.name) ? "<details class='howto'><summary>How to do it<\/summary><div class='body'>" + esc(g2.how) + "<\/div><\/details>" : "") +
        "<input class='txt' data-f='chres' placeholder='My result (reps, seconds, who won…)' value='" + esc(ch.res || "") + "'>" +
        "<label class='donebox'><input type='checkbox' data-f='chdone' " + (ch.done ? "checked" : "") + "> I did it! ⭐<\/label><\/section>";
    }
    if (P.cooldown.length) h += "<div class='card'><h2>🧊 Cool-down<\/h2>" + P.cooldown.map(function (it) { return "<label class='check'><input type='checkbox' data-f='cool' " + (r.cool ? "checked" : "") + "><span><b>" + esc(it.label) + "<\/b><br><span class='small'>" + esc(it.text) + "<\/span><\/span><\/label>"; }).join("") + "<\/div>";
    h += "<div class='card'><h2>How did it feel?<\/h2><div class='feel'>" + FEEL.map(function (f) { return "<button data-act='feel' data-v='" + f[0] + "' class='" + (r.feel === f[0] ? "on" : "") + "'><span>" + f[1] + "<\/span>" + f[0] + "<\/button>"; }).join("") + "<\/div>" +
      "<h2 style='margin-top:16px'>Notes<\/h2><textarea data-f='notes' placeholder='Anything fun, too easy, too hard, or anything that hurt?'>" + esc(r.notes || "") + "<\/textarea><\/div>";
    h += "<div class='saved' id='saved'><\/div><button class='btn green big' data-act='finish'>" + (r.finished ? "🎉 Finished! (tap for confetti)" : "🏁 Finish workout") + "<\/button>";
    var nx = d < 3 ? [w, d + 1] : (w < 12 ? [w + 1, 1] : null);
    h += "<div class='grid2'><a class='btn ghost' href='#/week/" + w + "'>🏠 Home<\/a>" + (nx ? "<a class='btn ghost' href='#/s/" + nx[0] + "/" + nx[1] + "'>Next ▶<\/a>" : "<a class='btn ghost' href='#/send/12'>📨 Send<\/a>") + "<\/div><\/main>";
    return h;
  }

  /* ---------------- SUMMARY / SEND ---------------- */
  function fmtSets(ex, e) {
    var out = [];
    for (var i = 0; i < ex.sets; i++) {
      var rp = ((e.r || [])[i] || "").trim(), wt = ((e.w || [])[i] || "").trim();
      if (!rp && !wt) continue;
      out.push(wt ? wt + "lb x " + (rp || "?") : rp);
    }
    return out.join(", ");
  }
  function sessionBlock(w, d) {
    var s = sess(w, d), r = rec(w, d), L = [];
    var head = "S" + s.num + " Day " + d + " " + s.type.toUpperCase();
    if (!r || (!r.finished && !r.date && !Object.keys(r.ex || {}).length && !(r.notes || "").trim())) return head + ": not done yet";
    var bits = [head];
    if (r.date) bits.push(fmtShort(parseDate(r.date)));
    bits.push(r.finished ? "FINISHED" : "partly done");
    if (r.feel) bits.push("felt " + r.feel);
    L.push(bits.join(" | "));
    s.exercises.forEach(function (ex, ei) {
      var e = (r.ex || {})[ei] || {}, sets = fmtSets(ex, e);
      var line = "- " + shortName(ex.name) + " (" + ex.sets + "x" + ex.reps + (P.weightsFirst && ex.weight != null ? " @" + ex.weight : "") + "): " + (sets || (e.done ? "done" : "-"));
      if ((e.note || "").trim()) line += " [" + e.note.trim() + "]";
      L.push(line);
    });
    if (s.challenge) { var ch = r.ch || {}; L.push("- Challenge " + shortName(s.challenge.name.replace(/^(RECORD|CELEBRATION):\s*/, "")) + ": " + ((ch.res || "").trim() || (ch.done ? "done" : "-"))); }
    if ((r.notes || "").trim()) L.push("  Notes: " + r.notes.trim());
    return L.join("\n");
  }
  function weekHeader(w, part, of) {
    var wk = week(w), n = 0; for (var d = 1; d <= 3; d++) { var r = rec(w, d); if (r && r.finished) n++; }
    return P.name + " - Week " + w + " of 12 (" + wk.phase + ")" + (of > 1 ? " - part " + part + "/" + of : "") + "\n" +
      (S.startDate ? "Dates: " + weekDates(w) + "\n" : "") + "Workouts finished: " + n + "/3";
  }
  function weekParts(w) {
    var LIMIT = 1800, blocks = [];
    for (var d = 1; d <= 3; d++) blocks.push(sessionBlock(w, d));
    var wn = (S.weekNotes[w] || "").trim(); if (wn) blocks.push("Week notes: " + wn);
    var foot = "(sent from " + P.name + "'s tracker app)";
    var full = weekHeader(w, 1, 1) + "\n\n" + blocks.join("\n\n") + "\n\n" + foot;
    if (full.length <= LIMIT) return [full];
    var parts = [], cur = [];
    var room = LIMIT - 120;
    blocks.forEach(function (b) {
      while (b.length > room) { // very long single block: hard split
        if (cur.length) { parts.push(cur); cur = []; }
        parts.push([b.slice(0, room)]); b = "(cont.) " + b.slice(room);
      }
      if ((cur.join("\n\n") + "\n\n" + b).length > room && cur.length) { parts.push(cur); cur = []; }
      cur.push(b);
    });
    if (cur.length) parts.push(cur);
    return parts.map(function (p, i) { return weekHeader(w, i + 1, parts.length) + "\n\n" + p.join("\n\n") + (i === parts.length - 1 ? "\n\n" + foot : ""); });
  }
  function mailto(w, body, i, n) {
    var subj = P.name + " Week " + w + " results" + (n > 1 ? " (part " + (i + 1) + " of " + n + ")" : "");
    return "mailto:" + P.coachEmail + "?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(body);
  }
  function send(w) {
    var parts = weekParts(w), all = parts.join("\n\n");
    var h = header("📨 Send week " + w, "Goes to " + esc(P.coachName) + ": " + esc(P.coachEmail), "#/week/" + w);
    h += "<main class='wrap'><div class='card'><div class='weekpick'><a class='iconbtn' style='background:var(--soft);color:var(--ink)' href='#/send/" + Math.max(1, w - 1) + "'>‹<\/a><div class='lbl'><b>Week " + w + "<\/b><\/div><a class='iconbtn' style='background:var(--soft);color:var(--ink)' href='#/send/" + Math.min(12, w + 1) + "'>›<\/a><\/div><\/div>";
    h += "<div class='card'><h2>Week notes (optional)<\/h2><textarea data-f='weeknote' data-w='" + w + "' placeholder='Missed days, what was fun, too easy / too hard, anything that hurt'>" + esc(S.weekNotes[w] || "") + "<\/textarea><div class='saved' id='saved'><\/div><\/div>";
    parts.forEach(function (p, i) {
      h += "<a class='btn big' id='mail" + i + "' href='" + esc(mailto(w, p, i, parts.length)) + "'>✉️ Email " + (parts.length > 1 ? "part " + (i + 1) + " of " + parts.length : "results") + "<\/a>";
    });
    h += "<button class='btn alt' data-act='copy'>📋 Copy results<\/button>";
    h += "<p class='muted small'>Email opens your mail app with everything filled in — just press Send. If nothing opens, tap <b>Copy results<\/b> and paste into an email to <b>" + esc(P.coachEmail) + "<\/b> with subject <b>" + esc(P.name) + " Week " + w + " results<\/b>." + (parts.length > 1 ? " It's long, so it is split into " + parts.length + " emails." : "") + "<\/p>";
    h += "<div class='card'><h2>Preview<\/h2><div class='muted small'>" + all.length + " characters<\/div><pre class='summary' id='summary'>" + esc(all) + "<\/pre><\/div><\/main>";
    return h;
  }

  /* ---------------- RULES ---------------- */
  function rules() {
    var h = header("🛟 Rules & Safety", esc(P.title), "#/week/" + (viewWeek || currentWeek()));
    h += "<main class='wrap rules'><div class='card'><p style='margin:0'>" + esc(P.intro) + "<\/p><\/div>";
    var order = P.sections.slice().sort(function (a, b) { return (/SAFETY/.test(b.title) ? 1 : 0) - (/SAFETY/.test(a.title) ? 1 : 0); });
    order.forEach(function (sec) {
      var safe = /SAFETY/.test(sec.title);
      h += "<details class='" + (safe ? "safety" : "") + "' " + (safe || /SCHEDULE|PROGRESSION/.test(sec.title) ? "open" : "") + "><summary>" + (safe ? "⚠️ " : /SCHEDULE/.test(sec.title) ? "📅 " : /PROGRESSION/.test(sec.title) ? "📈 " : /WARM/.test(sec.title) ? "🔥 " : /GOAL/.test(sec.title) ? "🎯 " : /FUN/.test(sec.title) ? "🎉 " : "📋 ") + esc(sec.title) + "<\/summary>";
      sec.items.forEach(function (it) { h += "<div class='item'><b>" + esc(it.label) + "<\/b>" + esc(it.text).replace(/\n/g, "<br>") + "<\/div>"; });
      h += "<\/details>";
    });
    h += "<details><summary>📖 Exercise guide<\/summary>" + P.guide.map(function (g) { return "<div class='item'><b>" + esc(g.name) + " <span class='badge'>" + esc(g.day) + "<\/span><\/b>" + esc(g.how) + "<\/div>"; }).join("") + "<\/details>";
    return h + "<\/main>";
  }

  /* ---------------- BACKUP ---------------- */
  function backup() {
    var h = header("💾 Backup", "Save or move your workout log", "#/week/" + (viewWeek || currentWeek()));
    h += "<main class='wrap'><div class='card'><h2>Save a backup<\/h2><p class='muted small'>Everything is saved on this phone automatically. Download a backup file now and then (or before switching phones).<\/p>" +
      "<button class='btn' data-act='export'>⬇️ Download backup file<\/button><button class='btn ghost' data-act='copybackup'>📋 Copy backup text<\/button>" + (window.STSync && STSync.status() ? "<p class='muted small'>☁️ " + esc(STSync.status()) + "<\/p>" : "") + "<\/div>" +
      "<div class='card'><h2>Restore a backup<\/h2><p class='muted small'>Pick a backup file (or paste backup text). This replaces the log on this phone.<\/p>" +
      "<input type='file' id='importFile' accept='application/json,.json,text/plain' class='txt'>" +
      "<textarea id='importText' placeholder='…or paste backup text here' style='margin-top:10px'><\/textarea><button class='btn alt' data-act='importtext'>⬆️ Restore pasted text<\/button><\/div>" +
      "<div class='card'><h2>Start over<\/h2><button class='btn ghost' data-act='reset' style='color:#b91c1c'>🗑️ Erase " + esc(P.name) + "'s log on this phone<\/button><\/div><\/main>";
    return h;
  }
  function backupObj() {
    var kids = {};
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("kidStrength:v1:") === 0) { try { kids[k.slice(15)] = JSON.parse(localStorage.getItem(k)); } catch (e) {} } }
    kids[KID] = S;
    return { app: "kid-strength-tracker", version: 1, exportedAt: new Date().toISOString(), kids: kids };
  }
  function doImport(text) {
    var o; try { o = JSON.parse(text); } catch (e) { toast("That isn't a backup file"); return; }
    var kids = o && o.kids; if (!kids && o && o.sessions) { kids = {}; kids[KID] = o; }
    if (!kids || typeof kids !== "object") { toast("That isn't a backup file"); return; }
    var names = Object.keys(kids).filter(function (k) { return kids[k] && typeof kids[k] === "object" && kids[k].sessions; });
    if (!names.length) { toast("No workout data found"); return; }
    if (!confirm("Restore backup for: " + names.join(", ") + "?\nThis replaces the current log on this phone.")) return;
    names.forEach(function (k) { localStorage.setItem("kidStrength:v1:" + k, JSON.stringify(kids[k])); });
    if (window.STSync) STSync.touch();
    S = load(); toast("Backup restored ✓"); location.hash = "#/home"; render();
  }

  /* ---------------- helpers ---------------- */
  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove("show"); }, 2200); }
  function copyText(text) {
    function fb() { var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); toast(ok ? "Copied! Paste it into an email 📋" : "Select the preview text and copy it"); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast("Copied! Paste it into an email 📋"); }, fb); else fb();
  }
  function confetti() {
    var c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c);
    var x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight, cols = ["#ff7a1a", "#14b8a6", "#3b5bdb", "#facc15", "#ec4899", "#22c55e", "#7c3aed"], ps = [];
    for (var i = 0; i < 160; i++) ps.push({ x: W / 2, y: H * 0.45, vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 4, s: 6 + Math.random() * 8, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 });
    var t0 = performance.now();
    (function f(t) { x.clearRect(0, 0, W, H); ps.forEach(function (p) { p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (t - t0 < 2600) requestAnimationFrame(f); else c.remove(); })(t0);
  }
  function finish(w, d) {
    var r = rec(w, d, true), s = sess(w, d), first = !r.finished;
    r.finished = true; r.finishedAt = r.finishedAt || new Date().toISOString(); r.date = r.date || todayStr(); save();
    confetti();
    var st = STICKERS[(s.num - 1) % STICKERS.length], m = document.createElement("div"); m.className = "modal";
    var chBonus = s.challenge && isChallengeDone(r);
    m.innerHTML = "<div class='box'><div class='big'>" + st + "<\/div><h2 style='font-size:28px;margin:6px 0'>" + (first ? "Awesome work, " + esc(P.name) + "!" : "Still awesome!") + "<\/h2><p>Workout #" + s.num + " finished" + (chBonus ? " + ⭐ challenge bonus" : "") + "!<br>Stickers: <b>" + stats().stickers.length + "<\/b><\/p>" +
      "<button class='btn' data-act='closemodal'>Yay! 🎉<\/button>" + (d === 3 ? "<a class='btn alt' href='#/send/" + w + "' data-act='closemodal'>📨 Send week " + w + "<\/a>" : "") + "<\/div>";
    document.body.appendChild(m);
    var btn = document.querySelector("[data-act=finish]"); if (btn) btn.textContent = "🎉 Finished! (tap for confetti)";
  }

  /* ---------------- router & events ---------------- */
  function route() { var p = (location.hash || "#/home").slice(2).split("/"); return p; }
  function render() {
    var p = route(), w = Math.min(12, Math.max(1, parseInt(p[1], 10) || 0)) || null;
    var html;
    if (p[0] === "s" && w && +p[2] >= 1 && +p[2] <= 3) { viewWeek = w; html = session(w, +p[2]); document.title = P.name + " • Week " + w + " Day " + p[2]; }
    else if (p[0] === "send") { w = w || viewWeek || currentWeek(); viewWeek = w; html = send(w); document.title = P.name + " • Send week " + w; }
    else if (p[0] === "rules") { html = rules(); document.title = P.name + " • Rules"; }
    else if (p[0] === "backup") { html = backup(); document.title = P.name + " • Backup"; }
    else { html = home(p[0] === "week" ? w : null); document.title = P.name + "'s Strength Tracker"; }
    app.innerHTML = html; window.scrollTo(0, 0);
  }
  function ctx() { var p = route(); return p[0] === "s" ? { w: +p[1], d: +p[2] } : null; }
  function onField(ev) {
    var el = ev.target, f = el.getAttribute && el.getAttribute("data-f");
    if (el.id === "startDate") { S.startDate = el.value || null; save(true); viewWeek = null; if (ev.type === "change") render(); return; }
    if (f === "weeknote") { S.weekNotes[el.getAttribute("data-w")] = el.value; save(); refreshSend(); return; }
    if (!f) return;
    var c = ctx(); if (!c) return;
    var r = rec(c.w, c.d, true), ei = el.getAttribute("data-e"), i = +el.getAttribute("data-i");
    if (!r.date && ev.type === "input") r.date = todayStr();
    var e = ei != null ? (r.ex[ei] = r.ex[ei] || {}) : null;
    if (f === "r" || f === "w") { (e[f] = e[f] || [])[i] = el.value.trim(); if (f === "r") autoDone(c, ei, e, el); }
    else if (f === "note") e.note = el.value;
    else if (f === "done") { e.done = el.checked; el.closest(".ex").classList.toggle("isdone", el.checked); if (!r.date) r.date = todayStr(); }
    else if (f === "warm") r.warm[i] = el.checked;
    else if (f === "cool") r.cool = el.checked;
    else if (f === "chres") r.ch.res = el.value;
    else if (f === "chdone") { r.ch.done = el.checked; if (el.checked) { toast("⭐ Bonus sticker!"); } }
    else if (f === "notes") r.notes = el.value;
    save();
  }
  function autoDone(c, ei, e, el) {
    var ex = sess(c.w, c.d).exercises[ei], all = true;
    for (var k = 0; k < ex.sets; k++) if (!((e.r || [])[k] || "").trim()) all = false;
    if (all && !e.done) { e.done = true; var card = el.closest(".ex"); card.classList.add("isdone"); card.querySelector("[data-f=done]").checked = true; }
  }
  function refreshSend() {
    var w = viewWeek, parts = weekParts(w), all = parts.join("\n\n"), pre = document.getElementById("summary");
    if (pre) pre.textContent = all;
    var a0 = document.getElementById("mail0");
    if (a0 && document.querySelectorAll("[id^=mail]").length === parts.length) parts.forEach(function (p, i) { document.getElementById("mail" + i).setAttribute("href", mailto(w, p, i, parts.length)); });
    else if (a0) { var y = scrollY, fe = document.activeElement && document.activeElement.getAttribute("data-f"); app.innerHTML = send(w); scrollTo(0, y); if (fe) { var t = app.querySelector("[data-f=" + fe + "]"); t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
  }
  document.addEventListener("input", function (ev) { if (ev.target.type !== "checkbox") onField(ev); });
  document.addEventListener("change", function (ev) { var t = ev.target; if (t.id === "importFile" && t.files && t.files[0]) { var fr = new FileReader(); fr.onload = function () { doImport(fr.result); }; fr.readAsText(t.files[0]); return; } if (t.type === "checkbox" || t.id === "startDate") onField(ev); });
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]"); if (!b) return;
    var a = b.getAttribute("data-act"), c = ctx();
    if (a === "wk") { viewWeek = +b.getAttribute("data-w"); location.hash = "#/week/" + viewWeek; }
    else if (a === "feel" && c) { var r = rec(c.w, c.d, true); r.feel = r.feel === b.getAttribute("data-v") ? "" : b.getAttribute("data-v"); if (!r.date) r.date = todayStr(); save(); b.parentNode.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x.getAttribute("data-v") === r.feel); }); }
    else if (a === "finish" && c) finish(c.w, c.d);
    else if (a === "closemodal") { var m = b.closest(".modal"); if (m) m.remove(); }
    else if (a === "copy") copyText(weekParts(viewWeek).join("\n\n"));
    else if (a === "export") {
      var blob = new Blob([JSON.stringify(backupObj(), null, 1)], { type: "application/json" }), u = URL.createObjectURL(blob), l = document.createElement("a");
      l.href = u; l.download = "strength-backup-" + KID + "-" + todayStr() + ".json"; document.body.appendChild(l); l.click(); setTimeout(function () { URL.revokeObjectURL(u); l.remove(); }, 1000); toast("Backup downloaded 💾");
    }
    else if (a === "copybackup") copyText(JSON.stringify(backupObj()));
    else if (a === "importtext") doImport(document.getElementById("importText").value);
    else if (a === "reset") { if (confirm("Erase ALL of " + P.name + "'s workout log on this phone? (Download a backup first!)")) { localStorage.removeItem(KEY); S = load(); toast("Erased"); location.hash = "#/home"; render(); } }
  });
  window.addEventListener("hashchange", render);
  try { localStorage.setItem("kidStrength:lastKid", KID); } catch (e) {}
  render();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.SINGLE_FILE) {
    navigator.serviceWorker.register(window.SW_PATH || "../sw.js", { scope: window.SW_SCOPE || "../" }).catch(function () {});
  }
  window.__tracker = { weekParts: weekParts, mailto: mailto, state: function () { return S; } };
})();
</script></body></html>
